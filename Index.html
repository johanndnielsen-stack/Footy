<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#08080f"/>
<title>Footy Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0c0c18;
  --surface:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.12);
  --border2:rgba(255,255,255,0.08);
  --text:#fff;
  --text2:#e8e8f0;
  --text3:#a0a0b8;
  --text4:#6e6e88;
  --text5:#4a4a60;

  /* accent = neon green variant (matches reference "green" variant) */
  --accent:#00f593;
  --accent2:#7c3aed;
  --accentGlow:rgba(0,245,147,0.3);
  --accent2Glow:rgba(124,58,237,0.35);
  --gradient:linear-gradient(135deg,#00f593 0%,#7c3aed 100%);
  --gradientCard:linear-gradient(135deg,rgba(0,245,147,0.12) 0%,rgba(124,58,237,0.08) 100%);

  /* card tier accents */
  --rookie:#00f593;
  --pro:#a78bfa;
  --legend:#f59e0b;

  --font-display:'Bebas Neue',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --nav-h:calc(64px + var(--safe-bottom));
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;}
body{display:flex;justify-content:center;}
#root{height:100%;overflow:hidden;display:flex;flex-direction:column;width:100%;max-width:480px;position:relative;background:var(--bg);}
body::before{content:'';position:fixed;inset:0;background:var(--bg);z-index:-1;}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none;color:inherit;}
button:active{transform:scale(0.96);}
svg{display:block;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:2px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}

/* ── HEADER ── */
#header{
  flex-shrink:0;padding:12px 16px 10px;
  background:var(--bg);border-bottom:1px solid var(--border2);
}
.header-inner{display:flex;justify-content:space-between;align-items:center;}
.header-sub{font-size:11px;color:var(--text4);letter-spacing:0.08em;text-transform:uppercase;font-weight:600;}
.header-title{font-size:20px;font-family:var(--font-display);color:var(--text);letter-spacing:0.04em;line-height:1.1;}
.header-avatar{
  width:34px;height:34px;border-radius:10px;
  background:var(--gradient);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;
  box-shadow:0 0 12px var(--accentGlow);
  flex-shrink:0;
}

/* ── SCREENS ── */
#screen-wrap{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.screen{padding:0 0 calc(16px + var(--nav-h));}

/* ── BOTTOM NAV ── */
#nav{
  flex-shrink:0;
  background:rgba(8,8,15,0.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:var(--safe-bottom);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 6px;background:none;border:none;cursor:pointer;
  color:var(--text5);transition:color .15s;
  font-family:var(--font-body);
}
.nav-btn.active{color:var(--accent);}
.nav-btn svg{transition:filter .15s;}
.nav-btn.active svg{filter:drop-shadow(0 0 6px var(--accent));}
.nav-label{font-size:9px;font-weight:400;}
.nav-btn.active .nav-label{font-weight:700;}
.nav-dot{width:16px;height:2px;border-radius:1px;background:var(--accent);margin-top:1px;}

/* ── NOTIFICATION ── */
#notif{
  position:fixed;top:20px;left:50%;
  transform:translateX(-50%) translateY(-100px);
  background:#0e0e1a;border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  color:var(--accent);padding:10px 22px;
  border-radius:100px;font-size:13px;font-weight:600;
  z-index:9999;white-space:nowrap;pointer-events:none;
  transition:transform 0.4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
#notif.show{transform:translateX(-50%) translateY(0);}

/* ── SECTION LABEL ── */
.sec-label{font-size:11px;color:var(--text4);letter-spacing:0.1em;text-transform:uppercase;font-weight:600;margin-bottom:10px;}

/* ── HERO CARD ── */
.hero-card{
  margin:16px 16px 0;
  background:var(--gradient);
  border-radius:20px;padding:20px;
  position:relative;overflow:hidden;
}
.hero-card::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.08);}
.hero-card::after{content:'';position:absolute;bottom:-20px;right:30px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.06);}
.hero-eyebrow{font-size:11px;color:rgba(255,255,255,0.7);font-weight:600;letter-spacing:0.1em;text-transform:uppercase;}
.hero-pts{font-size:52px;font-family:var(--font-display);color:#fff;line-height:1;margin-top:4px;}
.hero-sub{font-size:12px;color:rgba(255,255,255,0.65);margin-top:2px;}
.hero-chips{display:flex;gap:8px;margin-top:14px;}
.hero-chip{background:rgba(0,0,0,0.25);border-radius:8px;padding:6px 12px;}
.hero-chip-lbl{font-size:10px;color:rgba(255,255,255,0.6);}
.hero-chip-val{font-size:16px;font-family:var(--font-display);color:#fff;}

/* ── GLASS CARD ── */
.glass-card{
  background:rgba(255,255,255,0.06);border-radius:16px;
  padding:16px;border:1px solid var(--border);
}
.glass-card-sm{
  background:rgba(255,255,255,0.06);border-radius:14px;
  padding:12px 14px;border:1px solid var(--border);
}

/* ── ACCENT CARD ── */
.accent-card{
  background:var(--gradientCard);
  border:1px solid rgba(0,245,147,0.15);
  border-radius:16px;padding:14px 16px;
}

/* ── BUTTONS ── */
.btn-primary{
  width:100%;padding:14px;border-radius:14px;
  background:var(--gradient);border:none;
  color:#fff;font-size:14px;font-weight:700;
  cursor:pointer;letter-spacing:0.04em;
  box-shadow:0 4px 20px var(--accentGlow);
  font-family:var(--font-body);
  transition:transform .15s,box-shadow .15s;
}
.btn-primary:active{transform:scale(0.97);box-shadow:0 2px 10px var(--accentGlow);}
.btn-ghost{
  padding:10px 20px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text2);font-size:13px;font-weight:500;
  cursor:pointer;font-family:var(--font-body);
  transition:all .15s;
}
.btn-ghost:active{transform:scale(0.96);}
.btn-ghost.accent{color:var(--accent);border-color:rgba(0,245,147,0.3);}
.btn-ghost.accent2{color:var(--accent2);border-color:rgba(124,58,237,0.3);}
.btn-ghost.gold{color:var(--legend);border-color:rgba(245,158,11,0.3);}
.btn-ghost.danger{color:#f87171;border-color:rgba(248,113,113,0.3);}
.btn-ghost.dim{color:var(--text5);border-color:rgba(255,255,255,0.05);cursor:not-allowed;}
.btn-ghost.full{width:100%;text-align:center;justify-content:center;display:flex;align-items:center;gap:8px;}
.btn-ghost.sm{padding:7px 14px;font-size:12px;border-radius:9px;}

/* ── STAT PILLS ── */
.stat-pills{display:flex;gap:8px;}
.stat-pill{flex:1;background:var(--surface);border-radius:10px;padding:10px 8px;text-align:center;}
.stat-pill-val{font-size:18px;font-weight:700;color:var(--accent);}
.stat-pill-lbl{font-size:10px;color:var(--text4);margin-top:2px;text-transform:uppercase;letter-spacing:0.06em;}

/* ── PLAYER ROW ── */
.player-row{
  display:flex;align-items:center;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--border2);
  cursor:pointer;
}
.player-avatar{
  width:38px;height:38px;border-radius:12px;
  background:var(--gradientCard);
  border:1px solid var(--accentGlow);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;
}

/* ── MATCH CARD ── */
.match-card{
  background:var(--surface);border-radius:14px;
  padding:14px 16px;border:1px solid var(--border);
  margin-bottom:10px;
}

/* ── LEAGUE ROW ── */
.league-row{
  display:flex;align-items:center;gap:8px;
  padding:10px 0;border-bottom:1px solid var(--border2);
  position:relative;
}
.league-row.top{padding-left:10px;}
.league-row.top::before{
  content:'';position:absolute;left:0;top:50%;
  transform:translateY(-50%);
  width:3px;height:24px;border-radius:2px;background:var(--accent);
}

/* ── CARDS ── */
.card-mini{
  flex-shrink:0;width:86px;
  background:var(--surface);
  border:1px solid var(--card-border,var(--border));
  border-radius:14px;padding:8px;text-align:center;
  position:relative;overflow:hidden;transition:transform .15s;
}
.card-mini::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--card-accent,var(--accent)),transparent);opacity:.4;}
.card-mini:active{transform:scale(0.94);}

.card-full{
  width:100%;max-width:230px;min-width:140px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--card-border,var(--border));
  border-radius:20px;overflow:hidden;position:relative;
  box-shadow:0 0 40px var(--card-glow,rgba(0,245,147,.15)),0 20px 60px rgba(0,0,0,.8);
}
.card-full-art{
  width:100%;aspect-ratio:3/4;max-height:220px;position:relative;overflow:hidden;
}
.card-full-art img{
  width:100%;height:100%;object-fit:cover;object-position:center top;display:block;border-radius:12px 12px 0 0;
}

/* ── TRIVIA ── */
.q-opt{
  width:100%;padding:15px 18px;border-radius:14px;text-align:left;
  font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--text2);
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  transition:all .2s;min-height:52px;cursor:pointer;
}
.q-opt:hover{border-color:var(--q-color);color:var(--text);background:rgba(255,255,255,0.06);}
.q-opt.correct{border-color:var(--rookie)!important;color:var(--rookie)!important;background:rgba(0,245,147,0.07)!important;}
.q-opt.wrong{border-color:#f87171!important;color:#f87171!important;background:rgba(248,113,113,0.07)!important;}
.q-opt.hidden{opacity:0;pointer-events:none;}
.q-prog{height:3px;border-radius:3px;flex:1;transition:background .3s;}

/* ── STAT BARS ── */
.stat-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.stat-bar-bg{flex:1;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;}
.stat-bar-fill{height:100%;border-radius:2px;transition:width .8s ease;}
.xp-bg{height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-top:4px;}
.xp-fill{height:100%;border-radius:2px;background:var(--gradient);}

/* ── PITCH ── */
.pitch-bg{
  background:linear-gradient(180deg,#0a2e14 0%,#0d3d1a 50%,#0a2e14 100%);
  border-radius:20px;padding:16px 8px;
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:7px;padding:2px 7px;font-size:9px;letter-spacing:.5px;}

/* ── API BANNER ── */
.api-banner{
  margin:0 16px 0;
  background:linear-gradient(135deg,rgba(0,245,147,0.08),rgba(124,58,237,0.06));
  border:1px solid rgba(0,245,147,0.15);
  border-radius:16px;padding:14px 16px;
}
.api-input{
  width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;padding:10px 14px;color:var(--text2);
  font-family:monospace;font-size:12px;outline:none;margin-top:10px;
  transition:border-color .2s;
}
.api-input:focus{border-color:var(--accent);}

/* ── PORTRAIT / SHIMMER ── */
.shimmer{
  background:linear-gradient(110deg,#0d0f1e 30%,#181b2e 50%,#0d0f1e 70%);
  background-size:200% 100%;
  animation:shimmer 1.6s ease infinite;
}
.spinner{
  width:18px;height:18px;border:2px solid rgba(255,255,255,0.1);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;
  position:absolute;bottom:8px;right:8px;
}

/* ── OPP ROW ── */
.opp-row{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:13px 16px;
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;cursor:pointer;transition:all .2s;
}
.opp-row:hover{border-color:rgba(255,255,255,0.15);transform:translateX(3px);}
.opp-row.selected{border-color:var(--legend);background:rgba(245,158,11,0.06);}
.opp-row:active{transform:scale(0.98);}

/* ── EVENT LOG ── */
.event-log{
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:14px;padding:12px;
  max-height:240px;overflow-y:auto;font-size:11px;
}
.event-row{padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;gap:8px;align-items:flex-start;}
.event-row:last-child{border-bottom:none;}

/* ── VIDEO BACKGROUND ── */
.home-video-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:0;pointer-events:none;overflow:hidden;
}
.home-video-bg video{
  width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity 1.5s ease;
}
.home-video-bg video.loaded{opacity:1;}
.home-video-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(8,8,15,0.55) 0%,
    rgba(8,8,15,0.35) 30%,
    rgba(8,8,15,0.5)  70%,
    rgba(8,8,15,0.85) 100%
  );
}
/* Lift home screen content above video */
.home-screen-content{position:relative;z-index:1;}
/* Make hero card glass when video is showing */
.video-active .hero-card{
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.video-active .hero-pts{text-shadow:0 2px 20px rgba(0,0,0,0.8);}
.video-active .glass-card{
  background:rgba(8,8,15,0.6);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.video-active .btn-primary{box-shadow:0 4px 24px rgba(0,245,147,0.4);}

.dev-glow{box-shadow:0 0 20px rgba(0,245,147,.3),0 0 60px rgba(0,245,147,.1)!important;}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-up{animation:fadeUp .4s cubic-bezier(.2,.8,.4,1) forwards;}
.pop-in{animation:popIn .4s cubic-bezier(.34,1.56,.64,1) forwards;}

/* Stagger */
.stagger>*{opacity:0;animation:fadeUp .4s cubic-bezier(.2,.8,.4,1) forwards;}
.stagger>*:nth-child(1){animation-delay:.04s}
.stagger>*:nth-child(2){animation-delay:.08s}
.stagger>*:nth-child(3){animation-delay:.12s}
.stagger>*:nth-child(4){animation-delay:.16s}
.stagger>*:nth-child(5){animation-delay:.2s}
.stagger>*:nth-child(6){animation-delay:.24s}

/* ── FATIGUE / INJURY BADGE ── */
.status-pip{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.status-fresh{background:#00f593;box-shadow:0 0 5px rgba(0,245,147,.6);}
.status-tired{background:#f59e0b;box-shadow:0 0 5px rgba(245,158,11,.6);}
.status-injured{background:#f87171;box-shadow:0 0 5px rgba(248,113,113,.6);}
.status-inform{background:#a78bfa;box-shadow:0 0 5px rgba(167,139,250,.6);}
.fatigue-bar-bg{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:3px;}
.fatigue-bar-fill{height:100%;border-radius:2px;transition:width .6s;}

/* ── LIVE MATCH FEED ── */
.live-feed{display:flex;flex-direction:column;gap:8px;padding:0 16px;}
.live-score-bar{
  margin:0 16px 12px;
  background:rgba(255,255,255,0.07);
  border-radius:18px;padding:18px 20px;
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.live-event-card{
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;
  animation:slideIn .3s cubic-bezier(.2,.8,.4,1) forwards;
}
.live-event-card.goal{border-color:rgba(0,245,147,0.35);background:rgba(0,245,147,0.07);}
.live-event-card.goal-opp{border-color:rgba(248,113,113,0.35);background:rgba(248,113,113,0.07);}
.live-event-card.def{border-color:rgba(96,165,250,0.25);background:rgba(96,165,250,0.05);}
.live-event-icon{font-size:24px;flex-shrink:0;width:36px;text-align:center;}
.live-event-min{font-size:11px;font-weight:700;color:var(--text4);min-width:26px;}
.live-event-text{font-size:13px;font-weight:500;color:var(--text2);line-height:1.4;flex:1;}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* ── COMIC PANELS (kept for fallback) ── */
.comic-wrap{padding:0;overflow:hidden;}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#000;padding:3px;}
.panel{background:#0e0e20;position:relative;overflow:hidden;border-radius:4px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;}
.panel-wide{grid-column:span 2;aspect-ratio:2/1;}
.panel-text{font-size:10px;font-weight:700;text-align:center;letter-spacing:.5px;line-height:1.4;z-index:2;position:relative;}
.panel-bg{position:absolute;inset:0;opacity:.18;}
.panel-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.8);border-radius:4px;font-size:8px;font-weight:700;padding:2px 6px;letter-spacing:.5px;}
.panel-score{font-size:28px;font-family:var(--font-display);letter-spacing:4px;z-index:2;position:relative;}
.panel-action{font-size:32px;margin-bottom:4px;z-index:2;position:relative;}
@keyframes panelPop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.panel-in{animation:panelPop .3s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes goalFlash{0%,100%{background:#0e0e20}50%{background:#0e2b15}}
.panel-goal{animation:goalFlash .4s ease 2;}

/* ── TRANSFER MARKET ── */
.market-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.market-card.featured{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.04);}
.market-price{font-size:15px;font-family:var(--font-display);color:var(--legend);}
.market-sell-price{font-size:12px;color:var(--text3);}

/* ── PLAYER RATINGS ── */
.rating-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2);}
.rating-num{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:var(--font-display);flex-shrink:0;}
.rating-a{background:rgba(0,245,147,.15);color:#00f593;}
.rating-b{background:rgba(167,139,250,.15);color:#a78bfa;}
.rating-c{background:rgba(245,158,11,.15);color:#f59e0b;}
.rating-d{background:rgba(248,113,113,.15);color:#f87171;}

/* ── TIMELINE ── */
.timeline-wrap{position:relative;padding-left:20px;}
.timeline-wrap::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.08);}
.timeline-event{position:relative;margin-bottom:10px;}
.timeline-dot{position:absolute;left:-16px;top:4px;width:8px;height:8px;border-radius:50%;border:1px solid;}
.tl-goal-my{background:rgba(0,245,147,.3);border-color:#00f593;}
.tl-goal-opp{background:rgba(248,113,113,.3);border-color:#f87171;}
.tl-def{background:rgba(96,165,250,.3);border-color:#60a5fa;}
.tl-miss{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);}

/* ══ Retro arcade cutscenes ══ */
#cutscene{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;}
#cutscene.show{display:flex;pointer-events:auto;}
#cutscene .cut-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,rgba(8,8,15,.55),rgba(0,0,0,.92));}
#cutscene .cut-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px,rgba(0,0,0,.28) 4px);mix-blend-mode:multiply;animation:cutFlicker .12s steps(2,end) infinite;}
@keyframes cutFlicker{0%{opacity:.45}100%{opacity:.7}}
#cutscene .cut-stage{position:relative;width:100%;max-width:460px;height:280px;display:flex;align-items:center;justify-content:center;}
.cut-shake{animation:cutShake .12s steps(2,end) 7;}
@keyframes cutShake{0%{transform:translate(0,0)}25%{transform:translate(-7px,4px)}50%{transform:translate(6px,-5px)}75%{transform:translate(-5px,-3px)}100%{transform:translate(0,0)}}
.cut-title{font-family:var(--font-display);font-weight:900;text-transform:uppercase;line-height:.92;text-align:center;position:relative;z-index:3;
  animation:cutPop .42s steps(5,end) both, cutFlash .16s steps(2,end) 7 .42s;}
.cut-title .big{display:block;font-size:58px;letter-spacing:3px;text-shadow:4px 4px 0 #000,-2px -2px 0 rgba(0,0,0,.6),0 0 22px currentColor;}
.cut-title .sub{display:block;font-size:16px;letter-spacing:5px;margin-top:10px;color:#fff;text-shadow:3px 3px 0 #000;}
@keyframes cutPop{0%{transform:scale(0) rotate(-10deg);opacity:0}60%{transform:scale(1.3) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes cutFlash{0%{filter:brightness(1)}50%{filter:brightness(2.4)}100%{filter:brightness(1)}}
.cut-emoji{position:absolute;font-size:104px;image-rendering:pixelated;filter:drop-shadow(5px 5px 0 #000);animation:cutPop .42s steps(5,end) both;}
.cut-net{position:absolute;right:9%;top:22%;width:86px;height:118px;border:4px solid rgba(255,255,255,.85);border-left:none;image-rendering:pixelated;
  background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(255,255,255,.16) 8px 9px),repeating-linear-gradient(90deg,transparent 0 8px,rgba(255,255,255,.16) 8px 9px);
  animation:cutRipple .1s steps(2,end) 4 .5s;}
@keyframes cutRipple{0%{transform:translateX(0)}50%{transform:translateX(6px)}100%{transform:translateX(0)}}
.cut-ball{position:absolute;width:24px;height:24px;background:#fff;border:3px solid #000;image-rendering:pixelated;box-shadow:inset -6px -6px 0 rgba(0,0,0,.28),5px 5px 0 rgba(0,0,0,.4);animation:cutBall .5s steps(7,end) forwards;}
@keyframes cutBall{0%{left:-12%;top:82%;transform:rotate(0)}100%{left:60%;top:36%;transform:rotate(900deg)}}
.cut-confetti{position:absolute;width:8px;height:8px;top:26%;image-rendering:pixelated;animation:cutConfetti 1.15s steps(7,end) forwards;}
@keyframes cutConfetti{0%{transform:translateY(-30px) rotate(0);opacity:1}100%{transform:translateY(240px) rotate(360deg);opacity:0}}
.cut-skip{position:absolute;bottom:18px;right:16px;font-size:10px;color:rgba(255,255,255,.45);letter-spacing:1px;text-transform:uppercase;z-index:6;}
/* Top-down "tactics cam" goal play */
.cut-pitch{position:relative;width:min(95vw,460px);height:min(86vh,600px);border-radius:10px;overflow:hidden;
  background:#1f7a3a;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 30px,rgba(0,0,0,.05) 30px 60px);
  border:2px solid rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(0,0,0,.55),0 18px 50px rgba(0,0,0,.6);animation:cutPop .32s steps(4,end) both;}
.cut-pitch .pl-line{position:absolute;left:5%;right:5%;top:50%;height:2px;background:rgba(255,255,255,.45);}
.cut-pitch .pl-circle{position:absolute;left:50%;top:50%;width:80px;height:80px;border:2px solid rgba(255,255,255,.45);border-radius:50%;transform:translate(-50%,-50%);}
.cut-pitch .pl-box{position:absolute;left:22%;right:22%;top:0;height:60px;border:2px solid rgba(255,255,255,.45);border-top:none;}
.cut-pitch .pl-arc{position:absolute;left:42%;right:42%;top:60px;height:18px;border:2px solid rgba(255,255,255,.45);border-top:none;border-radius:0 0 40px 40px;}
.cut-pitch .pl-goal{position:absolute;left:37%;right:37%;top:-2px;height:9px;border:2px solid #fff;background:repeating-linear-gradient(90deg,transparent 0 5px,rgba(255,255,255,.35) 5px 6px);}
.cut-pitch .pl-box.b{top:auto;bottom:0;border:2px solid rgba(255,255,255,.45);border-bottom:none;}
.cut-pitch .pl-arc.b{top:auto;bottom:60px;border:2px solid rgba(255,255,255,.45);border-bottom:none;border-radius:40px 40px 0 0;}
.cut-pitch .pl-goal.b{top:auto;bottom:-2px;}
.cut-mark{position:absolute;width:28px;margin:-14px 0 0 -14px;transition:left 1s linear,top 1s linear;z-index:2;}
.cut-mark.scorer{z-index:3;}
.cut-mark .mk-av{width:28px;height:28px;border-radius:50%;overflow:hidden;border:2.5px solid #1fd576;background:#0a0a0f;box-shadow:0 0 5px rgba(31,213,118,.5),0 2px 6px rgba(0,0,0,.55);}
.cut-mark.opp .mk-av{background:#5a1414;border-color:#f4626b;box-shadow:0 0 5px rgba(244,98,107,.5),0 2px 6px rgba(0,0,0,.55);}
.cut-mark.scorer .mk-av{border-color:#00f593;box-shadow:0 0 0 2px #00f593,0 0 10px #00f593,0 2px 6px rgba(0,0,0,.55);}
.cut-mark .mk-av svg{width:100%;height:100%;display:block;}
.cut-mark .mk-k{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:14px;}
.cut-mark .mk-name{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:8px;line-height:1.1;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;background:rgba(0,0,0,.45);padding:1px 3px;border-radius:3px;pointer-events:none;}
@keyframes cutIdleA{0%,100%{transform:translate(0,0)}18%{transform:translate(7px,-9px)}40%{transform:translate(-8px,5px)}62%{transform:translate(5px,10px)}82%{transform:translate(-6px,-4px)}}
@keyframes cutIdleB{0%,100%{transform:translate(0,0)}22%{transform:translate(-9px,-6px)}48%{transform:translate(8px,7px)}72%{transform:translate(-4px,9px)}}
.cut-mark.idle .mk-av{animation:cutIdleA 2.6s ease-in-out infinite;}
.cut-mark.idle.b .mk-av{animation-name:cutIdleB;}
@keyframes cutGkIdle{0%,100%{transform:translate(0,0)}30%{transform:translate(2.5px,-1px)}60%{transform:translate(-2.5px,1px)}}
.cut-mark.gk .mk-av{animation:cutGkIdle 3.2s ease-in-out infinite;}
.qbar-fill{width:100%;height:100%;background:linear-gradient(90deg,#00f593,#f59e0b,#f87171);animation:qbar linear forwards;}
@keyframes qbar{from{width:100%}to{width:0}}
.cut-mark.mv{animation:cutDrift var(--cutdur,4500ms) ease-in-out forwards;}
@keyframes cutDrift{to{transform:translateY(var(--drift,0px));}}
.cut-ball2{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:2px solid #000;box-shadow:0 0 7px rgba(255,255,255,.85);transition:left 1.26s linear,top 1.26s linear;z-index:5;}
.cut-ball2.shot{transition:left .85s cubic-bezier(.3,0,.1,1),top .85s cubic-bezier(.3,0,.1,1);}
</style>

const POS_LABEL={GK:"Goalkeeper",DEF:"Defender",MID:"Midfielder",FWD:"Forward"};
function _tbPick(a){return a[Math.floor(Math.random()*a.length)];}
function _tbDistinct(arr,excl,n){const pool=arr.filter(x=>x!==excl);const out=[];while(out.length<n&&pool.length)out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);return out;}
function _clubDistract(ans){const r=TB.clubs.find(c=>c[0]===ans);const same=r?TB.clubs.filter(c=>c[1]===r[1]):[];const pool=(same.length>=4?same:TB.clubs).map(c=>c[0]);return _tbDistinct(pool,ans,3);}
function _numD(n){const s=new Set();let k=Math.max(0,n-2);while(s.size<3){if(k!==n&&k>=0)s.add(k);k++;}return [...s].map(String);}
const LEAGUE_COUNTRY={premier_league:"England",la_liga:"Spain",bundesliga:"Germany",serie_a:"Italy",ligue_1:"France",eredivisie:"Netherlands",primeira_liga:"Portugal",superliga:"Denmark"};
function triviaCtx(){

  if(!c) return {global:true,players:TB.players,clubs:TB.clubs};
  const cl=TB.clubs.filter(x=>x[1]===c), names=new Set(cl.map(x=>x[0]));
  const pl=TB.players.filter(p=>names.has(p[3]));
  return {global:false,country:c,leagueName:(typeof leagueName==="function"?leagueName(id):c),
    clubs:cl.length>=4?cl:TB.clubs, players:pl, hasPlayers:pl.length>=4, titles:(TB.leagueTitles||{})[c]};
}
function genTriviaQ(ctx){
  ctx=ctx||{global:true,players:TB.players,clubs:TB.clubs};
  const types=[];
  if(ctx.global){
    const P=TB.players, CL=TB.clubs;
    types.push(
      ()=>{const p=_tbPick(P);return{q:`Which country does ${p[0]} represent?`,a:p[1],d:_tbDistinct(TB.nations,p[1],3)};},
      ()=>{const p=_tbPick(P);return{q:`What position does ${p[0]} play?`,a:POS_LABEL[p[2]],d:_tbDistinct(Object.values(POS_LABEL),POS_LABEL[p[2]],3)};},
      ()=>{const p=_tbPick(P);return{q:`Which club does ${p[0]} play for?`,a:p[3],d:_clubDistract(p[3])};},
      ()=>{const p=_tbPick(P);return{q:`Which of these players plays for ${p[3]}?`,a:p[0],d:_tbDistinct(P.filter(x=>x[3]!==p[3]),null,3).map(x=>x[0])};},
      ()=>{const c=_tbPick(CL);return{q:`In which country does ${c[0]} play?`,a:c[1],d:_tbDistinct([...new Set(CL.map(x=>x[1]))],c[1],3)};},
      ()=>{const w=_tbPick(TB.worldCup);return{q:`Which nation won the ${w[0]} World Cup?`,a:w[1],d:_tbDistinct(TB.nations,w[1],3)};},
      ()=>{const b=_tbPick(TB.ballon);return{q:`Who won the ${b[0]} Ballon d'Or?`,a:b[1],d:_tbDistinct(TB.players.map(p=>p[0]).concat("Karim Benzema"),b[1],3)};},
      ()=>{const u=_tbPick(TB.ucl);return{q:`Which club won the ${u[0]} Champions League?`,a:u[1],d:_clubDistract(u[1])};},
      ()=>{const p=_tbPick(P);return{q:`Which of these players represents ${p[1]}?`,a:p[0],d:_tbDistinct(P.filter(x=>x[1]!==p[1]),null,3).map(x=>x[0])};},
      ()=>{const e=_tbPick(TB.euros);return{q:`Which nation won the ${e[0]} European Championship?`,a:e[1],d:_tbDistinct(TB.nations,e[1],3)};},
      ()=>{const c=_tbPick(CL);return{q:`Which of these clubs is from ${c[1]}?`,a:c[0],d:_tbDistinct(CL.filter(x=>x[1]!==c[1]),null,3).map(x=>x[0])};},
      ()=>{const w=_tbPick(TB.ballonWins);return{q:`How many Ballon d'Or awards has ${w[0]} won?`,a:String(w[1]),d:_numD(w[1])};},
      ()=>{const w=_tbPick(TB.wcWins);return{q:`How many World Cups has ${w[0]} won?`,a:String(w[1]),d:_numD(w[1])};},
      ()=>{return{q:`Which nation has won the most World Cups?`,a:TB.wcWins[0][0],d:_tbDistinct(TB.nations,TB.wcWins[0][0],3)};},
      ()=>{return{q:`Which player has won the most Ballon d'Or awards?`,a:TB.ballonWins[0][0],d:_tbDistinct(TB.ballonWins.map(b=>b[0]),TB.ballonWins[0][0],3)};},
      ()=>{const p=_tbPick(P);return{q:`Which ${p[1]} ${POS_LABEL[p[2]].toLowerCase()} plays for ${p[3]}?`,a:p[0],d:_tbDistinct(P.filter(x=>x[0]!==p[0]),null,3).map(x=>x[0])};},
    );
  } else {
    const CL=ctx.clubs, ln=ctx.leagueName;
    types.push(()=>{const c=_tbPick(CL);return{q:`Which of these clubs plays in the ${ln}?`,a:c[0],d:_tbDistinct(TB.clubs.filter(x=>x[1]!==ctx.country),null,3).map(x=>x[0])};});
    if(ctx.titles&&ctx.titles.length){
      types.push(()=>{const w=_tbPick(ctx.titles);return{q:`Which club won the ${ln} in ${w[0]}?`,a:w[1],d:_tbDistinct(CL.map(c=>c[0]),w[1],3)};});
      types.push(()=>{const cnt={};ctx.titles.forEach(t=>cnt[t[1]]=(cnt[t[1]]||0)+1);const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];return{q:`Which club has won the most ${ln} titles since ${ctx.titles[ctx.titles.length-1][0]}?`,a:top,d:_tbDistinct(CL.map(c=>c[0]),top,3)};});
    }
    if(ctx.hasPlayers){const P=ctx.players;types.push(
      ()=>{const p=_tbPick(P);return{q:`Which country does ${p[0]} represent?`,a:p[1],d:_tbDistinct(TB.nations,p[1],3)};},
      ()=>{const p=_tbPick(P);return{q:`What position does ${p[0]} play?`,a:POS_LABEL[p[2]],d:_tbDistinct(Object.values(POS_LABEL),POS_LABEL[p[2]],3)};},
      ()=>{const p=_tbPick(P);return{q:`Which club does ${p[0]} play for?`,a:p[3],d:_tbDistinct(CL.map(c=>c[0]).concat(TB.clubs.map(c=>c[0])),p[3],3)};},
      ()=>{const p=_tbPick(P);return{q:`Which of these players plays for ${p[3]}?`,a:p[0],d:_tbDistinct(P.filter(x=>x[3]!==p[3]),null,3).map(x=>x[0])};},
    );}
  }
  const t=_tbPick(types)();
  return {q:t.q,a:t.a,opts:[t.a,...t.d].sort(()=>Math.random()-0.5)};
}
function genTriviaRound(){
  const ctx=triviaCtx(), diffs=["easy","medium","hard"],out=[],used=new Set();
  let g=0; while(out.length<3&&g++<40){const x=genTriviaQ(ctx);if(used.has(x.q))continue;used.add(x.q);out.push({...x,diff:diffs[out.length]});}
  while(out.length<3){const x=genTriviaQ(ctx);out.push({...x,diff:diffs[out.length]});}
  return out;
}

let _ac=null;
function getAC(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
function playTone(freq,dur,type="sine",vol=0.18,delay=0){
  try{
    const ac=getAC();const t=ac.currentTime+delay;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(ac.destination);
    o.start(t);o.stop(t+dur);
  }catch(e){}
}
function playNoise(dur,vol=0.06,delay=0){
  try{
    const ac=getAC();const t=ac.currentTime+delay;
    const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const src=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
    src.buffer=buf;f.type="bandpass";f.frequency.value=400;f.Q.value=0.5;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f);f.connect(g);g.connect(ac.destination);src.start(t);src.stop(t+dur);
  }catch(e){}
}

// FATIGUE & INJURY SYSTEM
// ══════════════════════════════════════════════════════════
// fatigue: 0-100. >60=tired, >85=injury risk. Recovers +15 per trivia round.
// injuredFor: rounds remaining injured (0 = fit)
function getStatus(card){
  if((card.injuredFor||0)>0) return "injured";
  if((card.fatigue||0)>=60) return "tired";
  if((card.inForm||false)) return "inform";
  return "fresh";
}
function statusPip(card){
  const s=getStatus(card);
  const cls={fresh:"status-fresh",tired:"status-tired",injured:"status-injured",inform:"status-inform"}[s];
  return `<span class="status-pip ${cls}" title="${s}"></span>`;
}
function statusLabel(card){
  const s=getStatus(card);
  if(s==="injured") return `🔴 Injured (${card.injuredFor}r)`;
  if(s==="tired") return `🟡 Tired`;
  if(s==="inform") return `⚡ In Form`;
  return `🟢 Fresh`;
}
function cardMarketValue(card){
  const base=card.difficulty==="hard"?150:card.difficulty==="medium"?65:30;
  const s=getStatus(card);
  const lvlBonus=(card.level||1)*5;
  const formBonus=(card.inForm?20:0);
  const fatigPenalty=s==="tired"?-10:s==="injured"?-40:0;
  return Math.max(10, base + lvlBonus + formBonus + fatigPenalty + Math.round((card.overall-60)*0.8));
}
function cardSellPrice(card){ return Math.round(cardMarketValue(card)*0.6); }
function applyFatigueToTeam(){
  state.team.forEach(c=>{
    if((c.injuredFor||0)>0){c.injuredFor--;return;}
    const fatigue=(c.fatigue||0);
    const injRisk=fatigue>85?0.22:fatigue>70?0.08:0;
    if(Math.random()<injRisk){c.injuredFor=ri(1,3);c.fatigue=20;c.inForm=false;}
    else{c.fatigue=Math.min(100,(c.fatigue||0)+ri(12,22));}
    c.inForm=false;
  });
}
function recoverFatigue(){
  state.team.forEach(c=>{
    if((c.injuredFor||0)>0){c.injuredFor=Math.max(0,(c.injuredFor||0)-1);return;}
    c.fatigue=Math.max(0,(c.fatigue||0)-15);
  });
}
function markInForm(cardId){
  const c=state.team.find(x=>x.id==cardId);
  if(c) c.inForm=true;
}

function buyCard(idx){

  const price=cardMarketValue(c);

  state.collection.push(c);
  state.market.splice(idx,1);
  notify(`${c.name} signed! ⚽ -${price} pts`,"var(--accent)");
  render(true);
}
function listCard(cardId){
  const idx=state.collection.findIndex(c=>c.id==cardId);

  const c=state.collection[idx];
  if(state.team.some(t=>t.id===c.id)){notify(t('notif_remove_first'),"var(--legend)");return;}

  state.collection.splice(idx,1);
  state.points+=sell;
  notify(`Sold ${c.name} for ${sell} pts 💰`,"var(--legend)");
  render(true);
}

  JP:"J1 League", AU:"A-League",

function detectLocalLeague(){
  try{
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";
    // Extract country hint from timezone (e.g. "Europe/Copenhagen" → "DK")
    const tzMap={
      "Europe/Copenhagen":"DK","Europe/Stockholm":"SE","Europe/Oslo":"NO",
      "Europe/London":"GB","Europe/Madrid":"ES","Europe/Berlin":"DE",
      "Europe/Rome":"IT","Europe/Paris":"FR","Europe/Amsterdam":"NL",
      "Europe/Lisbon":"PT","America/New_York":"US","America/Los_Angeles":"US",
      "America/Chicago":"US","America/Sao_Paulo":"BR","America/Argentina/Buenos_Aires":"AR",
      "America/Mexico_City":"MX","Asia/Tokyo":"JP","Australia/Sydney":"AU",
    };
    const cc=tzMap[tz];
    if(!cc) return null;
    const lid=LOCAL_LEAGUE_MAP[cc];
    if(!lid) return null;
    // Check if it's already in LEAGUES list
    const known=LEAGUES.find(l=>l.id===lid);
    if(known) return known;
    // Return synthetic entry for local league
    const flags={DK:"🇩🇰",SE:"🇸🇪",NO:"🇳🇴",US:"🇺🇸",MX:"🇲🇽",BR:"🇧🇷",AR:"🇦🇷",JP:"🇯🇵",AU:"🇦🇺"};
    return {id:lid, flag:flags[cc]||"🏟️", name:LOCAL_LEAGUE_NAMES[lid]||lid, country:cc, local:true};
  }catch(e){return null;}
}

function getLeagueList(){
  const local=detectLocalLeague();
  // If local is already in the main list, just mark it; else prepend it
  let list=[...LEAGUES];
  if(local && !LEAGUES.find(l=>l.id===local.id)){
    list=[{...local,local:true},...list];
  }
  return list;
}

function leagueName(id){
  const all=getLeagueList();
  return all.find(l=>l.id===id)?.name||"Football";
}

function setLeague(id){
  state.triviaLeague=id;
  localStorage.setItem("fc_league",id);
  // Resolve "auto" on first save
  if(id==="auto"){
    const local=detectLocalLeague();
    if(local){state.triviaLeague=local.id;localStorage.setItem("fc_league",local.id);}
  }
  render();
}

const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rf=arr=>arr[Math.floor(Math.random()*arr.length)];

function genCard(diff){
  const pos=rf(POSITIONS),isGK=pos==="GK";
  const skills=isGK?SKILL_GK:SKILL_FIELD;
  const [lo,hi]=diff==="easy"?[45,65]:diff==="medium"?[65,82]:[82,99];
  const overall=ri(lo,hi);
  const stats={};
  skills.forEach(s=>stats[s]=ri(Math.max(40,overall-15),Math.min(99,overall+10)));
  return{
    id:Date.now()+Math.random(), name:`${rf(FIRST)} ${rf(LAST)}`,
    position:pos, nationality:rf(NATS), overall, stats, difficulty:diff, theme:THEMES[diff],
    jersey:rf(JERSEY_COLORS), skinTone:rf(SKIN_TONES), hairStyle:rf(HAIR_STYLES),
    xp:0, level:1, matches:0, goals:0, assists:0, achievements:[],
    portrait:null, portraitLoading:false,
  };
}
function genBotTeam(){
  return ["easy","easy","easy","medium","medium","medium","hard","hard","hard","easy","medium"]
    .map((d,i)=>{const c=genCard(d);c.position=POSITIONS[i];return c;});
}
function teamAvg(cards){return cards.length?Math.round(cards.reduce((s,c)=>s+c.overall,0)/cards.length):0;}
// Free low-rated squad for players with no team — tops up to a full XI covering
// the standard formation. Players then earn points (quiz/matches) to buy upgrades.
function claimStarterTeam(){
  const needed=[...POSITIONS];
  state.team.forEach(c=>{const i=needed.indexOf(c.position);if(i>=0)needed.splice(i,1);});
  needed.forEach(pos=>{
    const c=genCard("easy");      // easy tier = overall 45–65
    c.position=pos;
    state.collection.push(c);
    state.team.push(c);
  });
  saveState();
  notify(t('notif_starter_claimed'),"var(--accent)");
  navTo("league");
}
function xpPct(card){return Math.min(100,Math.round((card.xp%XP_PER_LEVEL)/XP_PER_LEVEL*100));}
function grantXP(card,amount){
  const changes=[];
  card.xp=(card.xp||0)+amount;
  const newLevel=Math.floor(card.xp/XP_PER_LEVEL)+1;
  if(newLevel>(card.level||1)){
    card.level=newLevel;
    const keys=Object.keys(card.stats);
    const key=rf(keys);
    const gain=card.difficulty==="easy"?ri(1,3):card.difficulty==="medium"?ri(1,2):1;
    if(card.stats[key]<99){
      card.stats[key]=Math.min(99,card.stats[key]+gain);
      const vals=Object.values(card.stats);
      const newOvr=Math.min(99,Math.round(vals.reduce((a,b)=>a+b,0)/vals.length));
      const ovrGain=newOvr-card.overall;
      card.overall=newOvr;
      changes.push({stat:key,gain,ovrGain});
      if(ovrGain>=3)grantAch(card,"breakout");
    }
  }
  if(card.xp>=100)grantAch(card,"century");
  return changes;
}
function grantAch(card,key){
  if(!card.achievements)card.achievements=[];
  if(!card.achievements.includes(key)){card.achievements.push(key);return true;}
  return false;
}

const IN_SANDBOX=location.href.startsWith("about:")||location.hostname==="www.claudeusercontent.com";
async function fetchPortrait(card){
  if(card.portrait||card.portraitLoading)return;
  if(IN_SANDBOX){fallback(card);return;}
  card.portraitLoading=true;
  updatePortraitEl(card.id,"loading",null,card);
  const nat=card.nationality.replace(/[^\w ]/g,"").trim();
  const tier=card.difficulty==="hard"?"elite veteran star":card.difficulty==="medium"?"professional":"young rising talent";
  const pose=ACTION_POSES[card.position]||ACTION_POSES.default;
  const col=colorName(card.jersey);
  const foil=card.difficulty==="hard"?"rose gold holographic foil border":card.difficulty==="medium"?"silver holographic foil border":"bronze foil border";
  const prompt=`Photorealistic soccer trading card, official premium sports card design, ${tier} ${nat} footballer, ${card.skinTone} skin tone, ${card.hairStyle} hair, ${pose}, professional stadium background with bokeh blurred crowd, dynamic motion blur on feet and ball, official kit with ${col} jersey, card with ${foil}, holographic shimmer texture on card surface, sharp focus on face, 4K ultra-detailed, sports photography style, Canon EF 85mm f1.4 lens, shallow depth of field, dramatic stadium lighting, cinematic`;
  try{
    const res=await fetch("/.netlify/functions/generate-art",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt,parameters:{num_inference_steps:4,width:512,height:768}})
    });
    if(!res.ok){console.warn("Art function error:",res.status);fallback(card);return;}
    const blob=await res.blob();
    const reader=new FileReader();
    reader.onload=()=>{
      card.portrait=reader.result;
      card.portraitLoading=false;
      updatePortraitEl(card.id,"done",card.portrait,card);
      updateMiniCardAvatar(card);
    };
    reader.onerror=()=>fallback(card);
    reader.readAsDataURL(blob);
  }catch(e){console.warn("fetchPortrait failed:",e);fallback(card);}
}
function fallback(card){card.portrait="fallback";card.portraitLoading=false;updatePortraitEl(card.id,"fallback",null,card);}
function updatePortraitEl(cardId,st,src,cardRef){
  const el=document.getElementById(`cardart-${cardId}`);
  if(!el)return;
  // Remove only the art layer (identified by data-art attribute), leave overlay divs intact
  const prev=el.querySelector("[data-art]");
  if(prev)prev.remove();
  const artEl=document.createElement("div");
  artEl.dataset.art="1";
  artEl.style.cssText="position:absolute;top:0;left:0;width:100%;height:100%;";
  if(st==="loading"){
    artEl.innerHTML=`<div class="shimmer" style="width:100%;height:100%;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.25);font-size:11px;letter-spacing:1px;">🎨<br/>GENERATING…</div><div class="spinner"></div>`;
  }else if(st==="done"&&src){
    artEl.innerHTML=`<img src="${src}" style="width:100%;height:100%;object-fit:cover;object-position:center top;display:block;border-radius:12px 12px 0 0;"/>`;
  }else{
    artEl.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.03);border-radius:12px 12px 0 0;">${cardRef?avSVG(cardRef,80):""}</div>`;

}

// ══════════════════════════════════════════════════════════
// MATCH ENGINE
// ══════════════════════════════════════════════════════════
function simulateMatch(myTeam,oppTeam,oppName,tacBonus=0){
  const _sz=t=>Math.max(0,11-((t&&t.length)||0))*3.5; // each missing player weakens the side
  const myAvg=teamAvg(myTeam)+(tacBonus||0)-_sz(myTeam),oppAvg=teamAvg(oppTeam)-_sz(oppTeam);

  // Formation bonus
  const formation=state.matchSetup?.formation||"4-4-2";
  const formBonus={attack:0,defence:0};
  if(formation==="4-3-3") formBonus.attack=5;
  if(formation==="4-5-1") formBonus.defence=5;
  if(formation==="3-5-2") formBonus.attack=2; // midfield dominance = slight attack edge

  // Captain bonus — captain's overall contributes +3 to team avg
  const captainId=state.matchSetup?.captain;
  const captainCard=captainId?myTeam.find(c=>c.id==captainId):null;
  const captainBonus=captainCard?3:0;

  const adjMyAvg=myAvg+formBonus.attack-formBonus.defence*0.5+captainBonus*0.3;
  const adjOppAvg=oppAvg+formBonus.defence*0.5-formBonus.attack*0.3;

  const events=[];let myG=0,oppG=0;
  const mins=[5,12,18,24,31,38,44,51,58,65,72,80,85,90].sort(()=>Math.random()-.5).slice(0,ri(8,12)).sort((a,b)=>a-b);
  const attackers=myTeam.filter(c=>["ST","LW","RW","CAM"].includes(c.position));
  const defenders=myTeam.filter(c=>["CB","LB","RB","GK"].includes(c.position));
  const mids=myTeam.filter(c=>c.position==="CM");
  const all=myTeam.length?myTeam:[genCard("easy")];
  const pEv={};

  // Captain gets priority in attack events
  const weightedAttackers=captainCard&&["ST","LW","RW","CAM"].includes(captainCard.position)
    ?[captainCard,captainCard,...attackers]:attackers;

  for(const min of mins){
    const myC=Math.max(0.06,Math.min(0.4,0.19+(adjMyAvg-adjOppAvg)*0.004));
    const opC=Math.max(0.05,Math.min(0.36,0.16+(adjOppAvg-adjMyAvg)*0.004));
    const roll=Math.random();
    if(roll<myC){
      const sc=rf(weightedAttackers.length?weightedAttackers:all);
      const as=rf(mids.length?mids:all.filter(c=>c.id!==sc.id));
      myG++;pEv[sc.id]=pEv[sc.id]||{g:0,a:0};pEv[sc.id].g++;
      if(as&&as.id!==sc.id){pEv[as.id]=pEv[as.id]||{g:0,a:0};pEv[as.id].a++;}
      events.push({type:"goal_my",scorerId:sc.id,assistId:(as&&as.id!==sc.id?as.id:null),text:`${min}' ⚽ ${sc.name} ${rf(actLang(GOAL_ACTIONS))}${as&&as.id!==sc.id?" ("+as.name.split(" ")[1]+"▶)":""}${sc.id===captainId?" 🅒":""}`});
    }else if(roll<myC+opC){
      oppG++;
      const oppAttackers=oppTeam.filter(c=>["ST","LW","RW","CAM"].includes(c.position));
      const oppScorer=rf(oppAttackers.length?oppAttackers:oppTeam);
      events.push({type:"goal_opp",text:`${min}' ⚽ ${oppScorer.name} ${rf(actLang(GOAL_ACTIONS))} (${oppName})`});
    }else if(Math.random()<0.45){
      const def=rf(defenders.length?defenders:all);
      events.push({type:"def",playerId:def.id,text:`${min}' 🛡️ ${def.name.split(" ")[1]} ${rf(actLang(DEF_ACTIONS))}`});
    }else{
      const att=rf(weightedAttackers.length?weightedAttackers:all);
      events.push({type:"miss",playerId:att.id,text:`${min}' 😬 ${att.name.split(" ")[1]} ${rf(actLang(MISS_ACTIONS))}`});
    }
  }
  let motm=null,motmScore=-1;
  for(const [id,ev] of Object.entries(pEv)){const sc=ev.g*3+ev.a;if(sc>motmScore){motmScore=sc;motm=id;}}
  if(!motm&&myTeam.length)motm=rf(myTeam).id;
  const result=myG>oppG?"win":myG===oppG?"draw":"loss";
  const ptGain=result==="win"?50:result==="draw"?20:5;
  return{myGoals:myG,oppGoals:oppG,result,ptGain,events,playerEvents:pEv,motm,oppName,formation,captain:captainCard?.name||null};
}
function applyMatch(matchData){
  const devs=[];
  const prevAch=state.team.map(c=>({id:c.id,ach:[...(c.achievements||[])]}));
  state.team.forEach(card=>{
    card.matches=(card.matches||0)+1;
    const ev=matchData.playerEvents[card.id]||{g:0,a:0};
    card.goals=(card.goals||0)+(ev.g||0);
    card.assists=(card.assists||0)+(ev.a||0);
    let xp=10+(ev.g||0)*15+(ev.a||0)*8+(matchData.result==="win"?10:0)+(card.id===matchData.motm?20:0);
    if(card.position==="GK"&&matchData.oppGoals===0)xp+=15;
    const changes=grantXP(card,xp);
    devs.push({card,changes,xp});
    if((ev.g||0)>=1)grantAch(card,"first_goal");
    if((ev.g||0)>=3)grantAch(card,"hat_trick");
    if(card.position==="GK"&&matchData.oppGoals===0)grantAch(card,"clean_sheet");
    if(card.id===matchData.motm)grantAch(card,"motm");
    if((card.matches||0)>=10)grantAch(card,"veteran");
  });
  const newAch=[];
  state.team.forEach(card=>{
    const prev=prevAch.find(p=>p.id===card.id);
    (card.achievements||[]).forEach(key=>{if(prev&&!prev.ach.includes(key))newAch.push({card,key});});
  });
  return{devs,newAch};
}

  // Shared filter test used by both the pitch view and the card grid.
  const matchesFilter=c=>(filter==="all"||c.difficulty===filter)&&(posFilter==="all"||c.position===posFilter);
  const isFiltering=filter!=="all"||posFilter!=="all";
  const avg=teamAvg(state.team);
  const tGoals=state.team.reduce((s,c)=>s+(c.goals||0),0);
  const tAch=state.team.reduce((s,c)=>s+(c.achievements||[]).length,0);

  // Pitch formation view
  const pitchMarkings=`<div style="position:absolute;inset:0;pointer-events:none;">
    <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.07);transform:translateX(-50%);"></div>
    <div style="position:absolute;left:50%;top:50%;width:80px;height:80px;border-radius:50%;border:1px solid rgba(255,255,255,.07);transform:translate(-50%,-50%);"></div>
    <div style="position:absolute;left:20%;right:20%;top:0;height:50px;border:1px solid rgba(255,255,255,.07);border-top:none;"></div>
    <div style="position:absolute;left:20%;right:20%;bottom:0;height:50px;border:1px solid rgba(255,255,255,.07);border-bottom:none;"></div>
  </div>`;

  // Pitch respects the active filters too — non-matching players are hidden.
  const pitchTeam=state.team.filter(matchesFilter);
  const rows=[
    {players:pitchTeam.filter(c=>["ST","LW","RW"].includes(c.position))},
    {players:pitchTeam.filter(c=>["CM","CAM"].includes(c.position))},
    {players:pitchTeam.filter(c=>["CB","LB","RB"].includes(c.position))},
    {players:pitchTeam.filter(c=>c.position==="GK")},
  ];
  const pitchPlayers=rows.map(row=>row.players.length?`<div style="display:flex;justify-content:center;gap:6px;margin-bottom:10px;">
    ${row.players.map(pl=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:52px;cursor:pointer;" onclick="removeFromTeam('${pl.id}')">
      <div style="width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,0.4);border:1.5px solid ${pl.theme.border};display:flex;align-items:center;justify-content:center;box-shadow:0 0 10px ${pl.theme.glow};position:relative;">
        ${avSVG(pl,28)}
        <div style="position:absolute;top:-4px;right:-4px;">${statusPip(pl)}</div>
      </div>
      <div style="background:rgba(0,0,0,0.6);border-radius:6px;padding:2px 5px;text-align:center;max-width:54px;">
        <div style="font-size:9px;color:#ccc;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${pl.name.split(" ")[1]}</div>
        <div style="font-size:10px;font-family:var(--font-display);color:${pl.theme.accent};">${pl.overall}</div>
      </div>
    </div>`).join("")}
  </div>`:"").join("");

  const emptySlots=11-state.team.length;
  const emptyHTML=(emptySlots>0&&!isFiltering)?`<div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:4px;">
    ${Array.from({length:emptySlots}).map(()=>`<div style="width:40px;height:40px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.15);font-size:16px;">+</div>`).join("")}
  </div>`:"";

  // Card collection with in-team state shown inline
  const filtered=state.collection.filter(matchesFilter);
  const tabs=["all","easy","medium","hard"].map(f=>{
    const col=DIFF_COLORS[f]||"#fff";

  const ownedPos=["GK","CB","LB","RB","CM","CAM","LW","RW","ST"].filter(p=>state.collection.some(c=>c.position===p));

          const inT=state.team.some(tm=>tm.id===c.id);

            ${fullCard(c)}
            ${inT
              ?`<button class="btn-ghost sm danger" onclick="removeFromTeam('${c.id}')">✕ Remove</button>`

          </div>`;
        }).join("")}
      </div>`;

  return `<div class="screen fade-up">
    <!-- Squad stats bar -->
    ${avg?`<div style="padding:16px 16px 0;display:flex;gap:8px;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;text-align:center;flex:1;">
        <div style="font-size:20px;font-family:var(--font-display);color:var(--accent);">${avg}</div>

// ── Step 2: pre-match setup (formation, lineup, tactic, kick off)
function renderPreMatch(){
  const isLeague=state.matchSetup?.isLeague;
  const isFriendLeague=state.matchSetup?.isFriendLeague;
  if(!isLeague&&!isFriendLeague&&(!window._bots||state.chosenOpp==null)) return renderMatch();

  // Build opponent display info
  let opp;
  if(isLeague){
    const nextLeague=getNextPlayerFixture();
    const oppName=nextLeague?(nextLeague.homeIsPlayer?nextLeague.away:nextLeague.home):"Opponent";
    const oppEntry=state.league?.teams?.find(t=>t.name===oppName);
    opp={name:oppName,avg:oppEntry?.avg||teamAvg(genBotTeam()),isLeague:true};
  } else if(isFriendLeague){
    const fl=state.friendLeague;
    const myName=fl?.myName;
    const upcoming=(fl?.fixtures||[]).filter(f=>!f.played&&f.week===fl.week);
    const nextMyFix=upcoming.find(f=>f.home===myName||f.away===myName);
    const oppName=nextMyFix?(nextMyFix.home===myName?nextMyFix.away:nextMyFix.home):"Opponent";
    const oppEntry=fl?.teams?.find(t=>t.name===oppName);
    opp={name:oppName,avg:oppEntry?.avg||teamAvg(genBotTeam()),isFriendLeague:true};
  } else {
    opp=window._bots[state.chosenOpp];
  }
  const myA=teamAvg(state.team);

  const FORMATIONS=["4-3-3","4-4-2","4-5-1","3-5-2"];
  const FORM_BONUS={"4-3-3":t('form_bonus_433'),"4-4-2":t('form_bonus_442'),"4-5-1":t('form_bonus_451'),"3-5-2":t('form_bonus_352')};
  const TACTICS=[
    {id:"motivate", label:t('tac_motivate'), icon:"🔥", desc:t('tac_motivate_desc')},
    {id:"calm",     label:t('tac_calm'), icon:"🧊", desc:t('tac_calm_desc')},
    {id:"press",    label:t('tac_press'), icon:"⚡", desc:t('tac_press_desc')},
  ];
  if(!state.matchSetup) state.matchSetup={formation:FORMATIONS[0],captain:state.team[0]?.id||null,swapMode:null,tactic:"calm"};
  const setup=state.matchSetup;
  const swapId=setup.swapMode;

  const FORM_ROWS={
    "4-3-3":[["ST","LW","RW"],["CM","CM","CM"],["CB","CB","LB","RB"],["GK"]],
    "4-4-2":[["ST","ST"],["LW","CM","CM","RW"],["CB","CB","LB","RB"],["GK"]],
    "4-5-1":[["ST"],["LW","CM","CAM","CM","RW"],["CB","CB","LB","RB"],["GK"]],
    "3-5-2":[["ST","ST"],["LW","CM","CAM","CM","RW"],["CB","CB","CB"],["GK"]],
  };

  const bench=[...state.collection].filter(c=>!state.team.some(t=>t.id===c.id)).sort((a,b)=>b.overall-a.overall);

  const pitchMarkings=`<div style="position:absolute;inset:0;pointer-events:none;">

  const teamSlots=state.team.slice(0,11);

          <div style="width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.5);border:${border};display:flex;align-items:center;justify-content:center;box-shadow:${glow};position:relative;">

            <div style="position:absolute;bottom:-3px;right:-3px;">${statusPip(pl)}</div>

          <div style="font-size:9px;font-family:var(--font-display);color:${pl.theme.accent};">${pl.overall}</div>

        <div style="text-align:center;flex:1;">

        </div>
        <div style="font-size:18px;color:var(--text4);padding:0 8px;">${t('lbl_vs')}</div>
        <div style="text-align:center;flex:1;">
          <div style="font-size:11px;color:var(--text4);margin-bottom:2px;">${opp.name}</div>
          <div style="font-size:24px;font-family:var(--font-display);color:${oppCol};">${opp.avg}</div>
        </div>
        <button onclick="${isLeague?"navTo('match')":isFriendLeague?"navTo('league')":"navTo('friendlysetup')"}" style="font-size:11px;color:var(--text4);background:none;border:none;cursor:pointer;padding:4px 8px;">${t('btn_back')}</button>
      </div>
      ${isLeague?`<div style="display:inline-flex;align-items:center;gap:6px;background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.3);border-radius:8px;padding:4px 10px;margin-top:8px;"><span style="font-size:10px;color:#a78bfa;font-weight:700;letter-spacing:.06em;">${t('tag_bot_fixture')}</span></div>`:isFriendLeague?`<div style="display:inline-flex;align-items:center;gap:6px;background:rgba(0,245,147,.12);border:1px solid rgba(0,245,147,.35);border-radius:8px;padding:4px 10px;margin-top:8px;"><span style="font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.06em;">${t('tag_friends_fixture')}</span></div>`:`<div style="display:inline-flex;align-items:center;gap:6px;background:rgba(0,245,147,.08);border:1px solid rgba(0,245,147,.2);border-radius:8px;padding:4px 10px;margin-top:8px;"><span style="font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.06em;">${t('tag_friendly')}</span></div>`}

        ${FORMATIONS.map(f=>{
          const active=setup.formation===f;
          return `<button onclick="setFormation('${f}')" class="btn-ghost sm ${active?"accent":""}" style="${active?"border-color:var(--accent);":""}">${f} <span style="font-size:9px;color:${active?"rgba(255,255,255,.5)":"var(--text4)"};">${FORM_BONUS[f]}</span></button>`;
        }).join("")}
      </div>
    </div>

    <!-- Lineup pitch -->
    <div style="padding:10px 16px 0;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <div class="sec-label" style="margin:0;">${swapId?t('swap_prompt'):t('lineup_hint')}</div>
        <span style="font-size:11px;color:var(--accent);">${t('col_avg')} ${myA}</span>
      </div>
      <div class="pitch-bg" style="position:relative;">
        ${pitchMarkings}
        <div style="position:relative;z-index:1;padding-top:6px;">${pitchRows}</div>
      </div>
      ${swapId?`<div style="margin-top:8px;padding:8px 12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:10px;font-size:12px;color:var(--legend);display:flex;justify-content:space-between;align-items:center;">
        <span>${t('swap_bench_hint')}</span>
        <button onclick="cancelSwap()" style="font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;">✕</button>
      </div>`:`<div style="margin-top:6px;font-size:10px;color:var(--text4);text-align:center;">${t('captain_hint')}</div>`}
    </div>

    <!-- Bench -->
    ${bench.length&&swapId?`<div style="padding:8px 16px 0;">
      <div class="sec-label">${t('sec_bench')}</div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;">
        ${bench.slice(0,8).map(c=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;" onclick="swapIn('${c.id}')">${miniCard(c,false,false)}</div>`).join("")}
      </div>
    </div>`:""}

    <!-- Team talk / tactic -->
    <div style="padding:12px 16px 0;">
      <div class="sec-label">${t('sec_team_talk')}</div>
      <div style="display:flex;gap:8px;">
        ${TACTICS.map(tac=>{
          const active=(setup.tactic||"calm")===tac.id;
          return `<div onclick="setTactic('${tac.id}')" style="flex:1;background:${active?"rgba(0,245,147,.07)":"var(--surface)"};border:1px solid ${active?"rgba(0,245,147,.3)":"var(--border)"};border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;transition:all .15s;">
            <div style="font-size:20px;margin-bottom:4px;">${tac.icon}</div>
            <div style="font-size:11px;font-weight:700;color:${active?"var(--accent)":"var(--text2)"};">${tac.label}</div>
            <div style="font-size:9px;color:var(--text4);margin-top:2px;">${tac.desc}</div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <!-- Kick off -->
    <div style="padding:16px 16px 0;">
      <button class="btn-primary" onclick="kickOff()">
        ${isFriendLeague?(state.matchSetup?.isAccepting?t('btn_kickoff_accept'):t('btn_send_challenge_wait')):t('btn_kick_off')}
      </button>
    </div>
  </div>`;
}

function renderMatchReport(){
  const m=state.match; if(!m)return renderHome();
  const col=m.result==="win"?"var(--accent)":m.result==="draw"?"var(--legend)":"#f87171";
  const icon=m.result==="win"?"🏆":m.result==="draw"?"🤝":"💔";

  // ── Player ratings (1–10 based on performance)
  const ratings=state.team.map(card=>{
    const ev=m.playerEvents[card.id]||{g:0,a:0};
    let r=5.5;
    r+=ev.g*1.2; r+=ev.a*0.7;
    if(card.id===m.motm) r+=1.5;
    if(card.position==="GK"&&m.oppGoals===0) r+=1.8;
    if(m.result==="win") r+=0.4;
    if((card.fatigue||0)>=60) r-=0.6;
    if((card.injuredFor||0)>0) r-=2;
    r=Math.max(3,Math.min(10,Math.round(r*10)/10));
    const cls=r>=8?"rating-a":r>=6.5?"rating-b":r>=5?"rating-c":"rating-d";
    return{card,r,ev,cls};
  }).sort((a,b)=>b.r-a.r);

  const ratingsHTML=`<div style="padding:0 16px;">
    <div class="sec-label">${t('sec_player_ratings')}</div>
    <div class="glass-card" style="padding:8px 12px;">
      ${ratings.map(({card,r,ev,cls})=>`<div class="rating-row">
        <div class="rating-num ${cls}">${r.toFixed(1)}</div>
        <div style="flex-shrink:0;">${avSVG(card,32)}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;">
            ${card.name.split(" ")[1]}
            ${statusPip(card)}
            ${card.id===m.motm?`<span style="font-size:9px;background:rgba(245,158,11,.15);color:var(--legend);padding:1px 5px;border-radius:4px;">MOTM</span>`:""}
          </div>
          <div style="font-size:10px;color:var(--text4);">${card.position}${ev.g?` · ${ev.g}⚽`:""}${ev.a?` · ${ev.a}▶`:""}</div>
        </div>
        <div style="font-size:10px;color:var(--text3);">${statusLabel(card)}</div>
      </div>`).join("")}
    </div>
  </div>`;

  // ── Events timeline
  const timelineHTML=`<div style="padding:0 16px;">
    <div class="sec-label">${t('sec_match_timeline')}</div>
    <div class="glass-card" style="padding:14px 16px;">
      <div class="timeline-wrap">
        ${m.events.map(e=>{
          const dotCls=e.type==="goal_my"?"tl-goal-my":e.type==="goal_opp"?"tl-goal-opp":e.type==="def"?"tl-def":"tl-miss";
          const textCol=e.type==="goal_my"?"var(--accent)":e.type==="goal_opp"?"#f87171":e.type==="def"?"#60a5fa":"var(--text4)";
          return `<div class="timeline-event">
            <div class="timeline-dot ${dotCls}"></div>
            <div style="font-size:12px;color:${textCol};line-height:1.4;">${e.text}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
  </div>`;

  // ── Fatigue report
  const fatigued=state.team.filter(c=>(c.fatigue||0)>=60||(c.injuredFor||0)>0);
  const fatigueHTML=fatigued.length?`<div style="padding:0 16px;">
    <div class="sec-label">${t('sec_fitness_report')}</div>
    <div class="glass-card" style="border-color:rgba(245,158,11,.2);padding:10px 12px;">
      ${fatigued.map(c=>{
        const fatPct=Math.min(100,c.fatigue||0);
        const barCol=(c.injuredFor||0)>0?"#f87171":(c.fatigue||0)>=80?"#f87171":"#f59e0b";
        return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);">
          ${avSVG(c,30)}
          <div style="flex:1;">
            <div style="font-size:12px;font-weight:600;">${c.name.split(" ")[1]} <span style="font-size:9px;color:var(--text4);">${c.position}</span></div>
            ${(c.injuredFor||0)>0
              ?`<div style="font-size:10px;color:#f87171;">${t('injured_out',{n:c.injuredFor,r:c.injuredFor>1?t('round_many'):t('round_one')})}</div>`
              :`<div class="fatigue-bar-bg"><div class="fatigue-bar-fill" style="width:${fatPct}%;background:${barCol};"></div></div>
               <div style="font-size:9px;color:var(--text4);margin-top:1px;">${t('fatigue_recover',{p:fatPct})}</div>`}
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`:"";

  const devs=(m.devData?.devs||[]).filter(d=>d.changes.length>0);
  const devHTML=devs.length?`<div style="padding:0 16px;">
    <div class="sec-label">${t('player_dev')}</div>
    ${devs.map(d=>`<div style="background:var(--surface);border:1px solid rgba(0,245,147,.15);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;">
      ${avSVG(d.card,38)}
      <div style="flex:1;">
        <div style="font-weight:600;font-size:13px;">${d.card.name}</div>
        ${d.changes.map(c=>`<div style="color:var(--accent);font-size:11px;">▲ ${c.stat} +${c.gain}${c.ovrGain>0?" · OVR +"+c.ovrGain:""}</div>`).join("")}
        <div style="color:var(--accent2);font-size:10px;margin-top:1px;">+${d.xp} XP · LVL ${d.card.level}</div>
      </div>
    </div>`).join("")}
  </div>`:"";

  const newAch=m.devData?.newAch||[];
  const achHTML=newAch.length?`<div style="padding:0 16px;">
    <div class="sec-label">${t('new_achievement')}</div>
    ${newAch.map(({card,key})=>`<div style="background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:12px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;">
      <span style="font-size:20px;">${ACHIEVEMENTS[key].icon}</span>
      <div><div style="color:var(--legend);font-weight:700;font-size:12px;">${ACHIEVEMENTS[key].label}</div>
      <div style="color:var(--text3);font-size:10px;">${card.name} — ${ACHIEVEMENTS[key].desc}</div></div>
    </div>`).join("")}
  </div>`:"";

  const motmCard=m.motm?state.team.find(c=>c.id==m.motm):null;
  return `<div class="screen fade-up">
    <!-- Score -->
    <div style="padding:16px 16px 0;">
      <div style="background:linear-gradient(135deg,rgba(0,0,0,.4),rgba(10,46,20,.4));border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:24px;text-align:center;position:relative;overflow:hidden;">
        <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(255,255,255,.01) 28px,rgba(255,255,255,.01) 29px);pointer-events:none;"></div>
        <div style="font-size:11px;color:var(--text4);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;">${t('lbl_full_time')}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div style="font-size:12px;font-weight:600;color:var(--text2);">${t('lbl_your_team_star')}</div>
          <div style="font-size:60px;font-family:var(--font-display);letter-spacing:8px;color:${col};">${m.myGoals}–${m.oppGoals}</div>
          <div style="font-size:12px;font-weight:600;color:var(--text2);">${m.oppName}</div>
        </div>
        <div style="display:inline-block;background:${col}18;border:1px solid ${col}44;color:${col};padding:5px 18px;border-radius:8px;font-weight:700;font-size:14px;letter-spacing:2px;">${icon} ${(m.result==="win"?t('win_label'):m.result==="draw"?t('draw_label'):t('loss_label')).toUpperCase()} · +${m.ptGain} pts</div>
      </div>
    </div>
    ${motmCard?`<div style="padding:20px 16px 0;">
      <div class="sec-label">${t('man_of_match')}</div>
      <div style="display:flex;justify-content:center;">${fullCard(motmCard,true)}</div>
    </div>`:""}
    <div style="padding:20px 16px 0;">${ratingsHTML.replace('<div style="padding:0 16px;">','<div>').replace('</div>','</div>',1)}</div>
    <div style="padding:0 16px 0;">${timelineHTML.replace('<div style="padding:0 16px;">','<div>').replace('</div>','</div>',1)}</div>
    ${devHTML}${achHTML}
    <div style="padding:0 16px 0;">${fatigueHTML.replace('<div style="padding:0 16px;">','<div>').replace('</div>','</div>',1)}</div>
    ${(state.match?.isLeague||state.match?.isFriendLeague)?`<div style="padding:20px 16px 0;">
      <button class="btn-primary" style="width:100%;" onclick="goToLeagueFromMatch()">${t('btn_back_to_league')}</button>
    </div>`:""}
    <div style="padding:20px 16px 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <button class="btn-ghost accent" onclick="navTo('match')">${t('btn_rematch')}</button>
      <button class="btn-ghost gold" onclick="navTo('market')">${t('btn_market')}</button>
      <button class="btn-ghost" onclick="navTo('home')">${t('btn_home')}</button>
    </div>
  </div>`;
}

function renderLeague(){
  const tab=state.leagueTab||"bot";

  // ── Tab switcher ───────────────────────────────────────────
  const tabBar=`<div style="display:flex;gap:6px;padding:14px 16px 0;">
    <button onclick="state.leagueTab='bot';render();" style="flex:1;padding:8px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid ${tab==='bot'?'var(--accent)':'var(--border)'};background:${tab==='bot'?'rgba(0,245,147,.12)':'var(--surface)'};color:${tab==='bot'?'var(--accent)':'var(--text3)'};">${t('tab_bot')}</button>
    <button onclick="state.leagueTab='friends';render();${state.friendLeague?.code?'startFriendLeaguePoll();':''}" style="flex:1;padding:8px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid ${tab==='friends'?'rgba(0,245,147,.5)':'var(--border)'};background:${tab==='friends'?'rgba(0,245,147,.12)':'var(--surface)'};color:${tab==='friends'?'var(--accent)':'var(--text3)'};">${t('tab_friends')}${state.friendLeague?.code?' ●':''}</button>
  </div>`;

  if(tab==="friends"){
    // ── Friends League tab ─────────────────────────────────
    const fl=state.friendLeague;

    if(!fl?.code){
      // Must have a full XI (11 players) before joining/creating a friends league.
      if(state.team.length<11){
        const have=state.team.length;
        const need=11-have;
        return `<div class="screen fade-up">
          ${tabBar}
          <div style="padding:20px 16px;">
            ${state.pendingJoinCode?`<div style="background:rgba(0,245,147,.1);border:1px solid rgba(0,245,147,.3);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--accent);text-align:center;margin-bottom:12px;">${t('fl_invited_to',{code:state.pendingJoinCode})}</div>`:""}
            <div class="glass-card" style="text-align:center;">
              <div style="font-size:42px;margin-bottom:10px;">🧤</div>
              <div style="font-size:18px;font-weight:700;margin-bottom:6px;">${t('squad_need_title')}</div>
              <div style="font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:18px;">${t('squad_need_desc')}</div>
              <button class="btn-primary" onclick="claimStarterTeam()" style="width:100%;">${have?t('squad_fill_btn',{n:need}):t('squad_get_btn')}</button>
              <div style="font-size:11px;color:var(--text4);margin-top:10px;">${t('squad_rookie_note')}</div>
            </div>
          </div>
        </div>`;
      }
      const myName=state.team.length?state.team[0]?.name?.split(" ")[1]||"My Team":"My Team";
      return `<div class="screen fade-up">
        ${tabBar}
        <div style="padding:20px 16px;">
          <div style="text-align:center;margin-bottom:24px;">
            <div style="font-size:36px;margin-bottom:8px;">🌐</div>
            <div style="font-size:13px;color:var(--text3);">${t('fl_intro')}</div>
          </div>
          <div class="glass-card" style="margin-bottom:12px;">
            <div class="sec-label" style="margin-bottom:10px;">${t('fl_create_header')}</div>
            <input id="fl-name-input" type="text" placeholder="${t('fl_team_name_ph')}" value="${myName}"
              style="width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:var(--font-body);font-size:13px;margin-bottom:10px;"/>
            <button class="btn-primary" onclick="createFriendLeague()" style="width:100%;">${t('btn_create_league')}</button>
          </div>
          <div class="glass-card">
            <div class="sec-label" style="margin-bottom:10px;">${t('fl_join_header')}</div>
            ${state.pendingJoinCode?`<div style="background:rgba(0,245,147,.1);border:1px solid rgba(0,245,147,.3);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--accent);text-align:center;margin-bottom:8px;">${t('fl_invited_to',{code:state.pendingJoinCode})}</div>`:""}
            <input id="fl-join-code" type="text" placeholder="${t('fl_code_ph')}" maxlength="4" value="${state.pendingJoinCode||''}"
              style="width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:var(--font-body);font-size:16px;letter-spacing:4px;text-transform:uppercase;margin-bottom:8px;"/>
            <input id="fl-join-name" type="text" placeholder="${t('fl_team_name_ph')}" value="${myName}"
              style="width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:var(--font-body);font-size:13px;margin-bottom:10px;"/>
            <button class="btn-ghost accent" onclick="joinFriendLeague()" style="width:100%;">${t('btn_join_league')}</button>
          </div>
        </div>
      </div>`;
    }

    if(fl.loading){
      return `<div class="screen fade-up">${tabBar}
        <div style="display:flex;align-items:center;justify-content:center;height:50vh;">
          <div style="text-align:center;color:var(--text3);"><div style="font-size:32px;margin-bottom:12px;">⏳</div><div>${t('fl_connecting')}</div></div>
        </div>
      </div>`;
    }

    const flTeams=[...(fl.teams||[])].map(t=>({...t,avg:t.name===fl.myName?teamAvg(state.team):t.avg,gd:(t.gf||0)-(t.ga||0)}))
      .sort((a,b)=>b.pts-a.pts||(b.gd-a.gd)||(b.gf-a.gf));
    const myName=fl.myName;
    const isLive=_friendPollTimer!==null;
    const recentFix=(fl.fixtures||[]).filter(f=>f.played).slice(-5).reverse();
    const upcoming=(fl.fixtures||[]).filter(f=>!f.played&&f.week===fl.week).slice(0,4);

    const flMyRow=flTeams.find(t=>t.name===myName)||{w:0,d:0,l:0,gf:0,ga:0,pts:0};
    const flMyPos=flTeams.findIndex(t=>t.name===myName)+1;
    const flMedal=p=>p===1?"🥇":p===2?"🥈":p===3?"🥉":`${p}.`;
    const flGd=(flMyRow.gf||0)-(flMyRow.ga||0);
    const flTotalWeeks=(fl.totalWeeks)||10;
    const flEnoughPlayers=flTeams.length>=2;
    // A solo league has no fixtures yet — it's not "done", it hasn't started.
    const flSeasonDone=flEnoughPlayers&&((fl.week||1)>flTotalWeeks||!upcoming.length);
    const nextMyFix=upcoming.find(f=>f.home===myName||f.away===myName);

    return `<div class="screen fade-up">
      ${tabBar}

      <!-- Incoming challenge banner -->
      ${(()=>{
        const ch=fl.challenge;
        if(!ch||ch.status!=="pending"||ch.to!==myName) return "";
        return '<div style="margin:12px 16px 0;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);border-radius:14px;padding:14px 16px;">'
          +'<div style="font-size:13px;font-weight:700;color:var(--legend);margin-bottom:4px;">'+t('fl_incoming_title')+'</div>'
          +'<div style="font-size:12px;color:var(--text2);margin-bottom:10px;">'+t('fl_incoming_desc',{from:ch.from})+'</div>'
          +'<div style="display:flex;gap:8px;">'
          +'<button class="btn-primary" style="flex:2;background:var(--legend);border-color:var(--legend);" onclick="acceptChallenge()">'+t('btn_accept_setup')+'</button>'
          +'<button class="btn-ghost" style="flex:1;color:#f87171;" onclick="declineChallenge()">'+t('btn_decline')+'</button>'
          +'</div></div>';
      })()}

      <!-- Code + live indicator -->
      <div style="padding:12px 16px 0;display:flex;gap:8px;align-items:center;">
        <div onclick="copyLeagueCode()" style="flex:1;background:rgba(0,245,147,.06);border:1px solid rgba(0,245,147,.2);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;">
          <div>
            <div style="font-size:9px;color:var(--text4);text-transform:uppercase;letter-spacing:.1em;">${t('fl_invite_code')}</div>
            <div style="font-size:22px;font-family:var(--font-display);color:var(--accent);letter-spacing:4px;">${fl.code}</div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
          <div style="font-size:9px;padding:3px 8px;border-radius:20px;background:${isLive?"rgba(0,245,147,.15)":"rgba(255,255,255,.06)"};color:${isLive?"var(--accent)":"var(--text4)"};border:1px solid ${isLive?"rgba(0,245,147,.3)":"var(--border)"};">${isLive?t('lbl_live'):t('lbl_off')}</div>
          <div style="display:flex;gap:6px;">
            <button class="btn-ghost sm accent" onclick="shareLeague()" style="font-size:11px;padding:5px 10px;">📲</button>
            <button class="btn-ghost sm" onclick="refreshFriendLeague()" style="font-size:11px;padding:5px 10px;">${t('btn_sync')}</button>
          </div>
        </div>
      </div>

      <!-- Hero position (with W/D/L/GD chips, matching bot league) -->
      <div class="hero-card">
        <div class="hero-eyebrow">${t('fl_week_season',{w:fl.week||1,s:fl.season||1})}</div>
        <div class="hero-pts">${flMedal(flMyPos)} #${flMyPos}</div>
        <div class="hero-sub">${flMyPos===1?t('hero_pos1_table'):flMyPos===2?t('hero_pos2'):flMyPos===3?t('hero_pos3'):t('hero_posn',{n:flMyPos-3})}</div>
        <div class="hero-chips">
          <div class="hero-chip"><div class="hero-chip-lbl">W</div><div class="hero-chip-val">${flMyRow.w||0}</div></div>
          <div class="hero-chip"><div class="hero-chip-lbl">D</div><div class="hero-chip-val">${flMyRow.d||0}</div></div>
          <div class="hero-chip"><div class="hero-chip-lbl">L</div><div class="hero-chip-val">${flMyRow.l||0}</div></div>
          <div class="hero-chip"><div class="hero-chip-lbl">GD</div><div class="hero-chip-val">${flGd>=0?"+":""}${flGd}</div></div>
        </div>
      </div>

      <!-- Next fixture card (matching bot league style, no simulate week) -->
