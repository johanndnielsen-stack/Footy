// RENDER — LIVE MATCH (Comic Panels)
// ══════════════════════════════════════════════════════════
function renderLiveMatch(){
  const lm=state.liveMatchState; if(!lm)return renderHome();
  const shown=lm.events.slice(0,lm.shown);
  const [myG,oppG]=lm.score;
  const scoreCol=myG>oppG?"#00f593":myG<oppG?"#f87171":"#f59e0b";
  const progress=lm.events.length>0?Math.round((lm.shown/lm.events.length)*90):0;
  const isLive=lm.shown<lm.events.length;

  // Build event rows — newest first
  const eventRows=[...shown].reverse().map((ev,idx)=>{
    const isMyGoal=ev.type==="goal_my";
    const isOppGoal=ev.type==="goal_opp";
    const isDef=ev.type==="def";
    const cls=isMyGoal?"goal":isOppGoal?"goal-opp":isDef?"def":"";
    const icon=isMyGoal?"⚽":isOppGoal?"⚽":isDef?"🛡️":"💨";
    const color=isMyGoal?"#00f593":isOppGoal?"#f87171":isDef?"#60a5fa":"var(--text4)";
    const txt=ev.text.replace(/^\d+'[ ]/,"");
    const min=ev.text.match(/^(\d+)'/)?.[1]||"";
    return `<div class="live-event-card ${cls}" style="animation-delay:${idx*0.06}s;">
      <div class="live-event-icon">${icon}</div>
      <div style="flex:1;min-width:0;">
        <div class="live-event-text">${txt}</div>
      </div>
      ${min?`<div class="live-event-min" style="color:${color};">${min}'</div>`:""}
    </div>`;
  }).join("");

  return `<div class="screen fade-up">
    <!-- Score bar -->
    <div class="live-score-bar">
      <div style="text-align:center;flex:1;">
        <div style="font-size:10px;color:var(--text4);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;">${t('lbl_your_team_star')}</div>
        <div style="font-size:42px;font-family:var(--font-display);color:${myG>=oppG?scoreCol:"var(--text2)"};">${myG}</div>
      </div>
      <div style="text-align:center;padding:0 16px;">
        <div style="font-size:11px;color:${scoreCol};font-weight:700;letter-spacing:.1em;">${isLive?t('lbl_live_short'):t('lbl_ft')}</div>
        <div style="font-size:10px;color:var(--text4);margin-top:4px;">${progress}'</div>
      </div>
      <div style="text-align:center;flex:1;">
        <div style="font-size:10px;color:var(--text4);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;">${lm.oppName}</div>
        <div style="font-size:42px;font-family:var(--font-display);color:${oppG>=myG&&oppG>0?scoreCol:"var(--text2)"};">${oppG}</div>
      </div>
    </div>
    <!-- Progress bar -->
    <div style="padding:0 16px 14px;">
      <div style="height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;">
        <div style="width:${progress}%;height:100%;background:var(--gradient);border-radius:2px;transition:width 1.5s;"></div>
      </div>
    </div>
    <!-- Event feed -->
    <div class="live-feed">
      ${shown.length===0?`<div style="text-align:center;padding:40px 0;color:var(--text4);font-size:13px;">${t('live_kickoff')}</div>`:eventRows}
      ${!isLive?"":`<div style="text-align:center;padding:12px 0;color:var(--text4);font-size:12px;">${t('live_in_progress')}</div>`}
    </div>
  </div>`;
}

// FRIENDS LEAGUE
// ══════════════════════════════════════════════════════════
let _friendPollTimer=null;

// ── Merge remote fixtures with local (local played state wins) ──
function _mergeFix(local,remote){
  return(remote||[]).map(rf=>{
    const lf=(local||[]).find(f=>f.home===rf.home&&f.away===rf.away&&f.week===rf.week);
    return(lf?.played)?lf:rf;
  });
}

// ── Fetch full league blob ──
async function fetchFullLeague(code){
  const res=await fetch("/.netlify/functions/league-create",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"fetch",code})
  });
  if(!res.ok) return null;
  const data=await res.json();
  return data.league||null;
}

// ── Single poll tick — shared by all phases ──
async function _doPollTick(){
  const fl=state.friendLeague;
  if(!fl?.code) return;
  const myName=fl.myName;
  const isWaiting=fl.challengeStatus==="waiting";
  try{
    // Waiting phase: fetch full league so we can detect accept immediately.
    // Idle phase: use lightweight status action to minimise Supabase reads.
    const res=await fetch("/.netlify/functions/league-create",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:isWaiting?"fetch":"status",code:fl.code})
    });
    if(!res.ok) return;
    const data=await res.json();
    const remote=data.league||data.status;
    if(!remote) return;
    const ch=remote.challenge;

    // ── Incoming challenge for me (idle) ──
    if(ch&&ch.status==="pending"&&ch.to===myName&&!fl.challengeStatus){
      const full=await fetchFullLeague(fl.code);
      if(!full) return;
      state.friendLeague={...fl,...full,fixtures:_mergeFix(fl.fixtures,full.fixtures)};
      render(true);
      notify(t('notif_challenged',{from:ch.from}),"var(--legend)");
      return;
    }

    // ── Challenger: opponent accepted → stop polling, auto-start ──
    if(ch&&ch.status==="accepted"&&ch.from===myName&&isWaiting){
      const pending=fl.pendingChallenge;
      if(pending){
        stopFriendLeaguePoll(); // no more polling — match is starting
        state.friendLeague={...fl,...remote,fixtures:_mergeFix(fl.fixtures,remote.fixtures)};
        notify(t('notif_opp_accepted'),"var(--accent)");
        const tactic=pending.setup?.tactic||"calm";
        const tacBonus={motivate:2,calm:0,press:5}[tactic]||0;
        setTimeout(()=>playFromChallenge(pending,tacBonus,tactic),800);
      }
      return;
    }

    // ── Generic standings change (idle only) ──
    if(!isWaiting){
      const prevHash=JSON.stringify({t:fl.teams,w:fl.week});
      const nextHash=JSON.stringify({t:remote.teams,w:remote.week});
      if(prevHash!==nextHash){
        const full=await fetchFullLeague(fl.code);
        if(full){
          state.friendLeague={...fl,...full,fixtures:_mergeFix(fl.fixtures,full.fixtures)};
          render(true);
          notify(t('notif_league_updated'),"var(--accent)");
        }
      }
    }
  }catch(e){console.warn("Friend league poll error:",e);}
}

// ── Phase-aware poll: 3s while waiting for accept, 30s when idle ──
function startFriendLeaguePoll(){
  stopFriendLeaguePoll();
  if(!state.friendLeague?.code) return;
  const isWaiting=state.friendLeague.challengeStatus==="waiting";
  const interval=isWaiting?3000:30000;
  _friendPollTimer=setInterval(async()=>{
    if(state.screen!=="league"||state.leagueTab!=="friends"){stopFriendLeaguePoll();return;}
    await _doPollTick();
  },interval);
}

// ── Restart poll to pick up new interval when phase changes ──
function restartPollForPhase(){
  stopFriendLeaguePoll();
  startFriendLeaguePoll();
}

function stopFriendLeaguePoll(){
  clearInterval(_friendPollTimer);
  _friendPollTimer=null;
}

function quickPlayFriendLeague(){
  const fl=state.friendLeague;
  if(!fl?.code) return;
  const myName=fl.myName;
  const upcoming=(fl.fixtures||[]).filter(f=>!f.played&&f.week===fl.week);
  const nextMyFix=upcoming.find(f=>f.home===myName||f.away===myName);
  if(!nextMyFix){notify(t('notif_no_fixture'),"#f87171");return;}
  const isHome=nextMyFix.home===myName;
  const oppName=isHome?nextMyFix.away:nextMyFix.home;
  const seed=[...(nextMyFix.home+nextMyFix.away+nextMyFix.week+(fl.season||1))].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7); // stable per fixture
  const matchData=genFriendMatchData(nextMyFix,seed);
  const devData=applyMatch(matchData);
  matchData.devData=devData;
  matchData.isFriendLeague=true;
  state.points+=matchData.ptGain;
  state.match=matchData;
  state.matchHistory.push({result:matchData.result,myGoals:matchData.myGoals,oppGoals:matchData.oppGoals,oppName,ptGain:matchData.ptGain,isFriendLeague:true,week:fl.week});
  nextMyFix.played=true;
  nextMyFix.hg=isHome?matchData.myGoals:matchData.oppGoals;
  nextMyFix.ag=isHome?matchData.oppGoals:matchData.myGoals;
  nextMyFix.result=matchData.result;
  const myEntry=fl.teams?.find(t=>t.name===myName);
  if(myEntry){
    if(matchData.result==="win"){myEntry.w=(myEntry.w||0)+1;myEntry.pts=(myEntry.pts||0)+3;}
    else if(matchData.result==="draw"){myEntry.d=(myEntry.d||0)+1;myEntry.pts=(myEntry.pts||0)+1;}
    else{myEntry.l=(myEntry.l||0)+1;}
    myEntry.gf=(myEntry.gf||0)+matchData.myGoals;
    myEntry.ga=(myEntry.ga||0)+matchData.oppGoals;
  }
  applyFatigueToTeam();
  if(matchData.motm) markInForm(matchData.motm);
  state.liveMatchState={events:matchData.events,shown:0,score:[0,0],oppName,oppTeam:getOppSquad(oppName),finalData:matchData};
  state.screen="livematch";
  render();
  sndKickoff();
  driveLiveMatch();
  syncFriendLeagueResult(nextMyFix);
}

async function syncFriendLeagueResult(fix){

  try{
    const res=await fetch("/.netlify/functions/league-sync",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:fl.code,home:fix.home,away:fix.away,hg:fix.hg,ag:fix.ag,week:fl.week,playerName:fl.myName,avg:teamAvg(state.team)})
    });
    if(!res.ok){console.warn("league-sync failed:",res.status);return;}
    const data=await res.json();
    if(data.league){
      const serverFix=data.league.fixtures||fl.fixtures;
      const merged=serverFix.map(rf=>{
        const lf=(fl.fixtures||[]).find(f=>f.home===rf.home&&f.away===rf.away&&f.week===rf.week);
        return(lf?.played)?lf:rf;
      });
      state.friendLeague={...fl,...data.league,fixtures:merged};
    }
  }catch(e){console.warn("Friend league sync error:",e);}
}

// Deterministic friend-match result from a shared seed + both teams' synced averages,
// so BOTH players get the identical score & timeline (each sees their own players' names).
function _lcg(seed){let s=(seed>>>0)||1;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function genFriendMatchData(fix,seed){
  const fl=state.friendLeague, myName=fl.myName;
  const iAmHome=fix.home===myName, oppName=iAmHome?fix.away:fix.home;
  const homeAvg=((fl.teams||[]).find(t=>t.name===fix.home)||{}).avg||65;
  const awayAvg=((fl.teams||[]).find(t=>t.name===fix.away)||{}).avg||65;
  const rnd=_lcg(seed);
  const hC=Math.max(0.06,Math.min(0.4,0.19+(homeAvg-awayAvg)*0.004));
  const aC=Math.max(0.05,Math.min(0.36,0.16+(awayAvg-homeAvg)*0.004));
  const raw=[]; // neutral, seed-only chance list → identical on both devices
  for(let m=5;m<90;m+=5){const roll=rnd(),s1=rnd(),s2=rnd(),min=m+Math.floor(s1*4);
    if(roll<hC)raw.push({min,kind:'hg',s1,s2});
    else if(roll<hC+aC)raw.push({min,kind:'ag',s1,s2});
    else if(s2<0.4)raw.push({min,kind:'def',s1,s2});
    else raw.push({min,kind:'miss',s1,s2});}
  const T=state.team||[];
  const att=T.filter(c=>["ST","LW","RW","CAM"].includes(c.position)),mid=T.filter(c=>["CM","CAM"].includes(c.position)),def=T.filter(c=>["CB","LB","RB"].includes(c.position));
  const pick=(arr,r)=>{const a=arr.length?arr:T;return a.length?a[Math.floor(r*a.length)]:null;};
  let hg=0,ag=0; const events=[]; const pEv={};
  raw.forEach(e=>{
    if(e.kind==='hg'||e.kind==='ag'){
      const homeScored=e.kind==='hg'; if(homeScored)hg++;else ag++;
      if(homeScored===iAmHome){const sc=pick(att,e.s1),as=pick(mid,e.s2);
        if(sc){pEv[sc.id]=pEv[sc.id]||{g:0,a:0};pEv[sc.id].g++; if(as&&as.id!==sc.id){pEv[as.id]=pEv[as.id]||{g:0,a:0};pEv[as.id].a++;}}
        events.push({type:"goal_my",scorerId:sc&&sc.id,assistId:(as&&sc&&as.id!==sc.id)?as.id:null,text:`${e.min}' ⚽ ${sc?sc.name:oppName} ${rf(actLang(GOAL_ACTIONS))}`});
      } else events.push({type:"goal_opp",text:`${e.min}' ⚽ ${oppName} ${rf(actLang(GOAL_ACTIONS))} (${oppName})`});
    } else if(e.kind==='def'){const d=pick(def,e.s1); events.push({type:"def",playerId:d&&d.id,text:`${e.min}' 🛡️ ${d?d.name.split(" ")[1]:""} ${rf(actLang(DEF_ACTIONS))}`});}
    else {const a=pick(att,e.s1); events.push({type:"miss",playerId:a&&a.id,text:`${e.min}' 😬 ${a?a.name.split(" ")[1]:""} ${rf(actLang(MISS_ACTIONS))}`});}
  });
  events.sort((a,b)=>(parseInt(a.text)||0)-(parseInt(b.text)||0));
  const myGoals=iAmHome?hg:ag, oppGoals=iAmHome?ag:hg;
  const result=myGoals>oppGoals?"win":myGoals===oppGoals?"draw":"loss", ptGain=result==="win"?50:result==="draw"?20:5;
  let motm=null,best=-1; for(const id in pEv){const sc=pEv[id].g*3+pEv[id].a; if(sc>best){best=sc;motm=id;}}
  if(!motm&&T.length)motm=T[0].id;
  return {myGoals,oppGoals,result,ptGain,events,playerEvents:pEv,motm,oppName,formation:(state.matchSetup&&state.matchSetup.formation)||"4-3-3",captain:null};
}
function playFromChallenge(ch,tacBonus,tactic){
  const fl=state.friendLeague;
  const myName=fl.myName;
  const fix=ch.fixture||ch;
  const isHome=fix.home===myName;
  const oppName=isHome?fix.away:fix.home;
  const matchData=genFriendMatchData(fix,ch.seed); // deterministic: same result for both players
  const devData=applyMatch(matchData);
  matchData.devData=devData;
  matchData.isFriendLeague=true;
  state.points+=matchData.ptGain;
  state.match=matchData;
  state.matchHistory.push({result:matchData.result,myGoals:matchData.myGoals,oppGoals:matchData.oppGoals,oppName,ptGain:matchData.ptGain,isFriendLeague:true,week:fl.week});
  const localFix=(fl.fixtures||[]).find(f=>f.home===fix.home&&f.away===fix.away&&f.week===fix.week);
  if(localFix){
    localFix.played=true;
    localFix.hg=isHome?matchData.myGoals:matchData.oppGoals;
    localFix.ag=isHome?matchData.oppGoals:matchData.myGoals;
    localFix.result=matchData.result;
  }
  const myEntry=fl.teams?.find(t=>t.name===myName);
  if(myEntry){
    if(matchData.result==="win"){myEntry.w=(myEntry.w||0)+1;myEntry.pts=(myEntry.pts||0)+3;}
    else if(matchData.result==="draw"){myEntry.d=(myEntry.d||0)+1;myEntry.pts=(myEntry.pts||0)+1;}
    else{myEntry.l=(myEntry.l||0)+1;}
    myEntry.gf=(myEntry.gf||0)+matchData.myGoals;
    myEntry.ga=(myEntry.ga||0)+matchData.oppGoals;
  }
  state.friendLeague={...fl,pendingChallenge:null,incomingChallenge:null,challengeStatus:null,challenge:null};
  const tacFatigueExtra={motivate:0,calm:0,press:8}[tactic]||0;
  applyFatigueToTeam();
  if(tacFatigueExtra>0) state.team.forEach(c=>{c.fatigue=Math.min(100,(c.fatigue||0)+tacFatigueExtra);});
  if(matchData.motm) markInForm(matchData.motm);
  state.liveMatchState={events:matchData.events,shown:0,score:[0,0],oppName,oppTeam:getOppSquad(oppName),finalData:matchData};
  state.screen="livematch";
  render(); sndKickoff(); driveLiveMatch();
  if(localFix) syncFriendLeagueResult(localFix);
}

function render(preserveScroll){
  saveState();

  const sw=document.getElementById("screen-wrap");
  const prevScroll=preserveScroll?sw.scrollTop:0;

  // Auto-poll friend league only when on league screen with friends tab active
  const onFriendsTab=state.screen==="league"&&state.leagueTab==="friends"&&state.friendLeague?.code;
  if(onFriendsTab&&!_friendPollTimer) startFriendLeaguePoll();

const QUIZ_TIME=15000; // per-question countdown (ms)
let _qTimer=null;
function startQTimer(){
  clearTimeout(_qTimer);
  state.qStart=Date.now();
  _qTimer=setTimeout(()=>{ if(state.screen==="trivia"&&!state.answered){ notify("⏱ Time's up!","#f87171"); answerQ("␀timeout"); } },QUIZ_TIME);
}
function answerQ(answer){
  if(state.answered)return;
  clearTimeout(_qTimer);
  const r=state.round,q=r.questions[r.current];
  const correct=answer===q.a;
  state.answered=true; state.chosen=answer;
  if(correct){
    state.points+=DIFF_PTS[q.diff];
    sndCorrect();
    notify(rf(COMMENTATOR_CORRECT),"var(--accent)");
  } else {
    sndWrong();
  }
  r.answers.push({q,answer,correct});
  if(correct)r.correct++;
  render(true);
}

function nextQ(){
  const r=state.round;
  if(r.current>=2){
    state.lastCards=r.answers.filter(a=>a.correct).map(a=>genCard(a.q.diff));
    state.collection.push(...state.lastCards);
    // Recover fatigue after studying (trivia round)
    recoverFatigue();
    // Refresh market after each round
    refreshMarket();
    state.screen="reward";
  }else{
    r.current++; state.answered=false; state.chosen=null; state.hidden5050=[]; state.audiencePoll=null; state.screen="trivia"; startQTimer();
  }
  render();

function use5050(){

const TOTAL_WEEKS=10; // season length

function startLeague(){
  if(state.team.length<3){notify(t("notif_need3"),"var(--legend)");return;}
  const myAvg=teamAvg(state.team);
  const botEntries=BOT_NAMES.map(name=>({name,avg:teamAvg(genBotTeam()),isPlayer:false,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  const playerEntry={name:"⭐ Your Team",avg:myAvg,isPlayer:true,w:0,d:0,l:0,gf:0,ga:0,pts:0};
  const teams=[playerEntry,...botEntries];

  // Generate round-robin fixtures — each team plays each other once
  const fixtures=[];
  for(let i=0;i<teams.length;i++){
    for(let j=i+1;j<teams.length;j++){
      fixtures.push({home:teams[i].name,away:teams[j].name,homeIsPlayer:teams[i].isPlayer,awayIsPlayer:teams[j].isPlayer,played:false,result:null,hg:0,ag:0});
    }
  }
  // Distribute fixtures across weeks (spread evenly)
  const perWeek=Math.ceil(fixtures.length/TOTAL_WEEKS);
  fixtures.forEach((f,i)=>{f.week=Math.floor(i/perWeek)+1;});

  state.league={teams,fixtures,week:1,season:1};
  state.screen="league";
  render();
}

function getLeagueTable(){
  const lg=state.league;
  return [...lg.teams].map(t2=>{
    // Count from played fixtures
    const w=lg.fixtures.filter(f=>f.played&&((f.homeIsPlayer&&t2.isPlayer||f.home===t2.name)&&f.hg>f.ag||(f.awayIsPlayer&&t2.isPlayer||f.away===t2.name)&&f.ag>f.hg)).length;
    // Recalculate from scratch off fixtures for accuracy
    let wins=0,draws=0,losses=0,gf=0,ga=0;
    lg.fixtures.filter(f=>f.played).forEach(f=>{
      const isHome=f.homeIsPlayer?t2.isPlayer:f.home===t2.name;
      const isAway=f.awayIsPlayer?t2.isPlayer:f.away===t2.name;
      if(!isHome&&!isAway)return;
      const myG=isHome?f.hg:f.ag;
      const opG=isHome?f.ag:f.hg;
      gf+=myG;ga+=opG;
      if(myG>opG)wins++;
      else if(myG===opG)draws++;
      else losses++;
    });
    // Player's AVG is always live so it reflects squad upgrades, not the
    // value snapshotted when the league started.
    const avg=t2.isPlayer?teamAvg(state.team):t2.avg;
    return{...t2,avg,w:wins,d:draws,l:losses,gf,ga,gd:gf-ga,pts:wins*3+draws,played:wins+draws+losses};
  }).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}

function getNextPlayerFixture(){
  const lg=state.league;
  if(!lg)return null;
  return lg.fixtures.find(f=>!f.played&&(f.homeIsPlayer||f.awayIsPlayer));
}

// Simulate every still-unplayed bot-vs-bot fixture up to (and including) uptoWeek.
function simulateLeagueWeek(uptoWeek){
  const lg=state.league;
  if(!lg)return;
  const upto=uptoWeek||lg.week;
  lg.fixtures.filter(f=>!f.played&&f.week<=upto&&!f.homeIsPlayer&&!f.awayIsPlayer).forEach(f=>{
    const homeAvg=lg.teams.find(t=>t.name===f.home)?.avg||65;
    const awayAvg=lg.teams.find(t=>t.name===f.away)?.avg||65;
    const edge=Math.round((homeAvg-awayAvg)/20); // stronger team gets a goals edge
    const hScore=Math.max(0,ri(0,3)+Math.max(0,edge));
    const aScore=Math.max(0,ri(0,3)+Math.max(0,-edge));
    f.hg=hScore;f.ag=aScore;f.played=true;
    f.result=hScore>aScore?"home":hScore===aScore?"draw":"away";
  });
}

function playLeagueMatch(tacBonus=0){
  const lg=state.league;
  const fix=getNextPlayerFixture();
  if(!fix)return;
  const isHome=fix.homeIsPlayer;
  const oppName=isHome?fix.away:fix.home;
  const oppTeam=lg.teams.find(t=>t.name===oppName);
  const oppAvg=oppTeam?.avg||65;
  // Simulate using existing engine
  const myTeam=state.team;
  const matchData=simulateMatch(myTeam,genBotTeam(),oppName,tacBonus);
  // Write result into fixture
  fix.played=true;
  fix.hg=isHome?matchData.myGoals:matchData.oppGoals;
  fix.ag=isHome?matchData.oppGoals:matchData.myGoals;
  fix.result=matchData.result;
  // Apply XP/development
  const devData=applyMatch(matchData);
  matchData.devData=devData;
  matchData.isLeague=true;
  state.points+=matchData.ptGain;
  state.match=matchData;
  state.matchHistory.push({result:matchData.result,myGoals:matchData.myGoals,oppGoals:matchData.oppGoals,oppName,ptGain:matchData.ptGain,isLeague:true,week:lg.week});
  // Play out the rest of this round: all bot-vs-bot games up to this week, then advance.
  const playedWeek=fix.week||lg.week;
  simulateLeagueWeek(playedWeek);
  lg.week=Math.min(playedWeek+1,TOTAL_WEEKS+1);
  if(!getNextPlayerFixture()) simulateLeagueWeek(TOTAL_WEEKS); // season finished → complete all bot fixtures
  applyFatigueToTeam();
  if(matchData.motm) markInForm(matchData.motm);
  const tactic=state.matchSetup?.tactic||"calm";
  const tacFatigueExtra={motivate:0,calm:0,press:8}[tactic]||0;
  if(tacFatigueExtra>0) state.team.forEach(c=>{c.fatigue=Math.min(100,(c.fatigue||0)+tacFatigueExtra);});
  state.liveMatchState={events:matchData.events,shown:0,score:[0,0],oppName,oppTeam:getOppSquad(oppName),finalData:matchData};
  state.screen="livematch";
  render();
  sndKickoff();
  driveLiveMatch();
}

// "Simulate Week" — skip ahead: auto-resolve your next fixture (no live match) + all bot games, then advance.
function simulateWeek(){
  const lg=state.league; if(!lg)return;
  const fix=getNextPlayerFixture();
  if(fix){
    const isHome=fix.homeIsPlayer;
    const oppName=isHome?fix.away:fix.home;
    const md=simulateMatch(state.team,genBotTeam(),oppName,0);
    fix.played=true;
    fix.hg=isHome?md.myGoals:md.oppGoals;
    fix.ag=isHome?md.oppGoals:md.myGoals;
    fix.result=md.result;
    applyMatch(md);
    state.points+=md.ptGain;
    state.matchHistory.push({result:md.result,myGoals:md.myGoals,oppGoals:md.oppGoals,oppName,ptGain:md.ptGain,isLeague:true,week:fix.week});
    applyFatigueToTeam();
    const wk=fix.week||lg.week;
    simulateLeagueWeek(wk);
    lg.week=Math.min(wk+1,TOTAL_WEEKS+1);
    if(!getNextPlayerFixture()) simulateLeagueWeek(TOTAL_WEEKS);
    const col=md.result==="win"?"var(--accent)":md.result==="draw"?"var(--legend)":"#f87171";
    notify(`Week done · ${md.myGoals}–${md.oppGoals} vs ${oppName}`,col);
  } else {
    simulateLeagueWeek(lg.week);
    lg.week=Math.min(lg.week+1,TOTAL_WEEKS+1);
    notify("Week simulated","var(--accent)");
  }
  render();
}

async function kickOff(){
  const tactic=state.matchSetup?.tactic||"calm";
  const tacBonus={motivate:2,calm:0,press:5}[tactic]||0;
  // Route to league match if flagged
  if(state.matchSetup?.isLeague){
    playLeagueMatch(tacBonus);
    return;
  }
  // Route to friend league match if flagged
  if(state.matchSetup?.isFriendLeague){
    const fl=state.friendLeague;
    if(!fl?.code) return;
    // Accepting opponent: simulate from incoming challenge seed
    if(state.matchSetup.isAccepting){
      const ch=fl.incomingChallenge;
      if(!ch){notify(t('notif_challenge_expired'),"#f87171");state.screen="league";render();return;}
      // Now that my setup is finished, tell the server I've accepted — this is
      // what releases the challenger to start. Both sides then kick off from the
      // same seed, so neither match begins before both players are ready.
      try{
        await fetch("/.netlify/functions/league-create",{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({action:"accept-challenge",code:fl.code,by:fl.myName})
        });
      }catch(e){console.warn("Accept challenge error",e);}
      playFromChallenge(ch,tacBonus,tactic);
      return;
    }
    // Challenger: save setup to pendingChallenge and send challenge
    state.matchSetup._savedTacBonus=tacBonus;
    sendChallenge();
    return;
  }
  if(state.chosenOpp==null||!window._bots)return;
  const opp=window._bots[state.chosenOpp];
  const oppTeam=genBotTeam();
  const tacFatigueExtra={motivate:0,calm:0,press:8}[tactic]||0;
  const matchData=simulateMatch(state.team,oppTeam,opp.name,tacBonus);
  const devData=applyMatch(matchData);
  matchData.devData=devData;
  matchData.tactic=tactic;
  state.points+=matchData.ptGain;
  state.match=matchData;
  state.matchHistory.push({result:matchData.result,myGoals:matchData.myGoals,oppGoals:matchData.oppGoals,oppName:matchData.oppName,ptGain:matchData.ptGain});
  state.chosenOpp=null;
  applyFatigueToTeam();
  if(tacFatigueExtra>0) state.team.forEach(c=>{c.fatigue=Math.min(100,(c.fatigue||0)+tacFatigueExtra);});
  if(matchData.motm) markInForm(matchData.motm);
  state.liveMatchState={events:matchData.events,shown:0,score:[0,0],oppName:matchData.oppName,oppTeam:getOppSquad(matchData.oppName),finalData:matchData};
  state.screen="livematch";
  render();
  sndKickoff();
  driveLiveMatch();
}

const SCENE={
  goal_my: {up:true,  side:"attack", color:"#00f593", titles:["GOAL!","SCREAMER!","TOP BINS!","WORLDIE!","TOP CORNER!","GET IN!"], confetti:true,  shake:true,  outcome:"goal"},
  miss:    {up:true,  side:"attack", color:"#f59e0b", titles:["OFF THE POST!","JUST WIDE!","OVER THE BAR!","SO CLOSE!"],          confetti:false, shake:true,  outcome:"miss"},
  def:     {up:false, side:"defend", color:"#60a5fa", titles:["BLOCK!","INTERCEPTED!","CLEARED!","NOT TODAY!"],                  confetti:false, shake:false, outcome:"stop"},
  goal_opp:{up:false, side:"defend", color:"#f87171", titles:["CONCEDED","BEATEN!","OH NO…"],                                    confetti:false, shake:true,  outcome:"concede"},
};
const _rnd=(a,b)=>a+Math.random()*(b-a);
const _pick=a=>a[Math.floor(Math.random()*a.length)];
const MATCH_SPEED=3; // event-to-event pacing (1 = original, 3 = 3× slower)
const CUT_SPEED=2.2; // cutscene choreography slow-mo (kept lower so richer plays don't drag)
const _shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const _clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

// Per-opponent squads (avatars + names), generated once and cached so a bot keeps its roster.
// Names are guaranteed unique vs your team and every other generated squad.
const _oppSquads={};
function getOppSquad(name){
  const key=name||"Rivals";
  if(_oppSquads[key]) return _oppSquads[key];
  const sn=n=>(n||"").split(" ").slice(-1)[0];
  const used=new Set((state.team||[]).map(c=>sn(c.name)));
  Object.values(_oppSquads).forEach(sq=>sq.forEach(c=>used.add(sn(c.name))));
  const squad=genBotTeam();
  squad.forEach(c=>{let g=0;while(used.has(sn(c.name))&&g<60){c.name=rf(FIRST)+" "+rf(LAST);g++;}used.add(sn(c.name));});
  _oppSquads[key]=squad;
  return squad;
}
// Lay a full team out in formation (attack-space). role: 'attack' (toward ay 0) or 'defend'.
function layoutTeam(cards,role,sideKey){
  const rows=role==='attack'?{GK:96,DEF:80,MID:57,FWD:34}:{GK:5,DEF:21,MID:45,FWD:64};
  const bk=c=>c.position==='GK'?'GK':['CB','LB','RB'].includes(c.position)?'DEF':['CM','CAM'].includes(c.position)?'MID':'FWD';
  const groups={GK:[],DEF:[],MID:[],FWD:[]};
  cards.forEach(c=>groups[bk(c)].push(c));
  if(!groups.GK.length){for(const kk of ['DEF','MID','FWD'])if(groups[kk].length){groups.GK.push(groups[kk].shift());break;}} // emergency keeper if none
  const markers=[]; let n=0;
  ['GK','DEF','MID','FWD'].forEach(k=>{
    const arr=groups[k], m=arr.length;
    arr.forEach((c,i)=>{
      const x=m===1?50:18+64*(i/(m-1));
      markers.push({id:sideKey+(n++),card:c,opp:sideKey==='o',gk:k==='GK',idle:(k!=='GK'),drift:(k!=='GK'),
        ax:_clamp(x+_rnd(-3,3),6,94),ay:rows[k]+_rnd(-2.5,2.5),
        name:(c.name||'').split(' ').slice(-1)[0]});
    });
  });
  return markers;
}

// Procedurally build a randomised top-down play (real-time). Both full teams stand in formation
// (your side minus injured/sent-off); the players involved in the move act it out.
function buildPlay(kind,ev){
  const cfg=SCENE[kind]; if(!cfg) return null;
  const myAvail=(state.team||[]).filter(c=>c&&!((c.injuredFor||0)>0)&&!c.suspended);
  if(!myAvail.length) return null;
  const lm=state.liveMatchState;
  const oppName=(lm&&lm.oppName)||"Rivals";
  const oppTeam=((lm&&lm.oppTeam)||getOppSquad(oppName)).filter(Boolean);
  const byId=id=>myAvail.find(c=>c.id===id);
  const J=(v,j)=>v+_rnd(-j,j);
  const out={color:cfg.color,title:_pick(cfg.titles),confetti:cfg.confetti,shake:cfg.shake,up:cfg.up,
    min:((ev&&ev.text||"").match(/^(\d+)'/)||[])[1]||"", markers:[], steps:[]};

  const attackingMine=cfg.side==="attack";
  const myMarks=layoutTeam(myAvail, attackingMine?"attack":"defend","m");
  const opMarks=layoutTeam(oppTeam, attackingMine?"defend":"attack","o");
  out.markers=[...opMarks,...myMarks]; // opponents drawn under, your players on top
  const P={}; out.markers.forEach(m=>P[m.id]={ax:m.ax,ay:m.ay});
  const mMark=card=>myMarks.find(m=>m.card===card);
  const oMark=card=>opMarks.find(m=>m.card===card);

  if(cfg.side==="attack"){
    const scorer=byId(ev.scorerId)||myAvail.find(c=>["ST","LW","RW"].includes(c.position))||myAvail[0];
    const assist=(ev.assistId&&byId(ev.assistId))||myAvail.find(c=>["CM","CAM"].includes(c.position)&&c!==scorer)||myAvail.find(c=>c!==scorer&&c.position!=='GK')||scorer;
    const sm=mMark(scorer); if(sm){sm.scorer=true; sm.ay=_clamp(sm.ay-_rnd(8,16),16,sm.ay); P[sm.id]={ax:sm.ax,ay:sm.ay};}
    const cands=myAvail.filter(c=>c!==scorer&&c!==assist&&["CM","CAM","LW","RW","ST"].includes(c.position));
    const mids=_shuffle(cands).slice(0,_pick([1,1,2]));
    const path=[assist,...mids,scorer].map(mMark).filter(Boolean).map(m=>m.id);
    if(path.length<2){const any=myMarks.find(m=>m.card!==scorer&&!m.gk); if(any)path.unshift(any.id);}
    const gkId=(opMarks.find(m=>m.gk)||{}).id;
    const oppDefIds=oppTeam.filter(c=>["CB","LB","RB"].includes(c.position)).map(c=>(oMark(c)||{}).id).filter(Boolean);
    const nearOpp=(ax,ay)=>{let b=null;oppDefIds.forEach(id=>{const p=P[id];if(!p)return;const dd=(p.ax-ax)**2+(p.ay-ay)**2;if(!b||dd<b.dd)b={id,dd};});return b&&b.id;};
    out.ball={ax:P[path[0]].ax,ay:P[path[0]].ay};
    out.steps.push({dur:300});
    const dribbleLeg=Math.floor(_rnd(0,Math.max(1,path.length-1)));
    for(let i=0;i<path.length-1;i++){
      const fromId=path[i], toId=path[i+1];
      if(i===dribbleLeg){
        const f=P[fromId]; const ndx=_clamp(f.ax+_rnd(-10,10),12,88), ndy=Math.max(P[toId].ay+_rnd(5,12),f.ay-_rnd(8,15));
        const moves=[{id:fromId,ax:ndx,ay:ndy}]; P[fromId]={ax:ndx,ay:ndy};
        const d=nearOpp(ndx,ndy);
        if(d){const dx=_clamp(P[d].ax*0.45+ndx*0.55,8,92),dy=Math.min(P[d].ay+_rnd(3,8),ndy+_rnd(2,7));moves.push({id:d,ax:dx,ay:dy});P[d]={ax:dx,ay:dy};}
        out.steps.push({dur:540,ball:{ax:ndx,ay:ndy},moves});
      }
      const t=P[toId]; const last=(i===path.length-2);
      const rx=_clamp(t.ax+_rnd(-7,7),10,90), ry=last?_rnd(9,16):Math.max(t.ay-_rnd(3,12),16);
      const moves=[{id:toId,ax:rx,ay:ry}]; P[toId]={ax:rx,ay:ry};
      const d2=nearOpp(rx,ry); if(d2&&Math.random()<0.6){const dx=_clamp((P[d2].ax+rx)/2,8,92),dy=Math.min(P[d2].ay+_rnd(2,7),ry+_rnd(2,8));moves.push({id:d2,ax:dx,ay:dy});P[d2]={ax:dx,ay:dy};}
      out.steps.push({dur:Math.round(_rnd(430,520)),ball:{ax:rx,ay:ry},moves});
    }
    if(cfg.outcome==="miss"){ // shot misses the target → keeper just shifts, doesn't dive
      const wide=Math.random()<0.6;
      out.title=wide?_pick(["JUST WIDE!","OFF THE POST!","SO CLOSE!"]):_pick(["OVER THE BAR!","SKIED IT!","OVER!"]);
      const b=wide?{ax:_pick([6,94]),ay:5}:{ax:J(50,6),ay:-3};
      const kx=b.ax<50?J(43,3):J(57,3);
      out.steps.push({dur:340,shot:true,ball:b,moves:gkId?[{id:gkId,ax:kx,ay:J(4.5,1)}]:[]});
    } else { // goal → into a corner, keeper goes the right way but is beaten at the post
      const side=Math.random()<0.5?-1:1, cornerX=side<0?J(41,3):J(59,3), dive=side<0?J(36,4):J(64,4);
      out.steps.push({dur:340,shot:true,ball:{ax:cornerX,ay:2},moves:gkId?[{id:gkId,ax:dive,ay:J(4.5,1)}]:[]});
    }
  } else {
    const myGk=myAvail.find(c=>c.position==="GK")||myAvail[myAvail.length-1];
    const hero=byId(ev&&ev.playerId)||myAvail.find(c=>["CB","LB","RB"].includes(c.position))||myAvail[0];
    const hm=mMark(hero); if(hm&&cfg.outcome==="stop")hm.scorer=true;
    const gkId=(myMarks.find(m=>m.gk)||{}).id, heroId=(mMark(hero)||{}).id;
    const oMid=oppTeam.find(c=>["CM","CAM"].includes(c.position))||oppTeam.find(c=>c.position!=="GK")||oppTeam[0];
    const oFwd=oppTeam.find(c=>["ST","LW","RW"].includes(c.position))||oppTeam.find(c=>c!==oMid&&c.position!=="GK")||oMid;
    const carrierId=(oMark(oMid)||{}).id, fwdId=(oMark(oFwd)||{}).id;
    out.ball={ax:P[carrierId].ax,ay:P[carrierId].ay};
    out.steps.push({dur:300});
    const a1x=_clamp(P[fwdId].ax+_rnd(-6,6),10,90), a1y=Math.max(P[fwdId].ay-_rnd(4,12),24);
    out.steps.push({dur:460,ball:{ax:a1x,ay:a1y},moves:[{id:fwdId,ax:a1x,ay:a1y}]}); P[fwdId]={ax:a1x,ay:a1y};
    const drx=_clamp(a1x+_rnd(-8,8),15,85), dry=_rnd(12,20);
    const hx=heroId?_clamp((P[heroId].ax+drx)/2,12,88):drx, hy=heroId?Math.min(P[heroId].ay+_rnd(6,14),dry+_rnd(2,6)):dry;
    const mv2=[{id:fwdId,ax:drx,ay:dry}]; if(heroId){mv2.push({id:heroId,ax:hx,ay:hy});P[heroId]={ax:hx,ay:hy};}
    out.steps.push({dur:540,ball:{ax:drx,ay:dry},moves:mv2}); P[fwdId]={ax:drx,ay:dry};
    if(cfg.outcome==="stop"){
      const ix=heroId?_clamp((drx+hx)/2,12,88):drx, iy=dry+_rnd(3,8);
      out.steps.push({dur:380,ball:{ax:ix,ay:iy},moves:heroId?[{id:heroId,ax:ix,ay:iy}]:[]});
    } else {
      const side=Math.random()<0.5?-1:1, cornerX=side<0?J(41,3):J(59,3), dive=side<0?J(36,4):J(64,4);
      out.steps.push({dur:340,shot:true,ball:{ax:cornerX,ay:2},moves:gkId?[{id:gkId,ax:dive,ay:J(4.5,1)}]:[]});
    }
  }

  // Ambient: uninvolved outfielders drift gradually toward the attacked-goal end (ay→0),
  // spread across the steps so it's a smooth glide via transitions (never a teleport).
  const _active=new Set(); out.steps.forEach(s=>(s.moves||[]).forEach(mv=>_active.add(mv.id)));
  const _movers=out.markers.filter(m=>!m.gk&&!_active.has(m.id));
  const _bEnd=(out.steps.filter(s=>s.ball).slice(-1)[0]||{}).ball; // where the ball is heading
  const _idxs=out.steps.map((s,i)=>i).filter(i=>i>0); const _nS=_idxs.length||1;
  _movers.forEach(m=>{
    let tx,ty;
    if(_bEnd&&Math.hypot(m.ax-_bEnd.ax,m.ay-_bEnd.ay)<26){ // close to the ball's destination → run straight for it
      tx=_clamp(_bEnd.ax+_rnd(-7,7),6,94); ty=_clamp(_bEnd.ay+_rnd(4,14),6,98);
    } else { // otherwise drift toward that end (defenders less, forwards more)
      const dy=m.ay>70?_rnd(10,18):m.ay>45?_rnd(15,25):_rnd(19,30);
      tx=_clamp(m.ax+(50-m.ax)*0.2+_rnd(-3,3),6,94); ty=_clamp(m.ay-dy,8,98);
    }
    _idxs.forEach((si,k)=>{const p=(k+1)/_nS;(out.steps[si].moves=out.steps[si].moves||[]).push({id:m.id,ax:m.ax+(tx-m.ax)*p,ay:m.ay+(ty-m.ay)*p});});
  });

  // Guarantee unique on-field labels (surname → "J. Surname" → numbered).
  const usedNames=new Set();
  out.markers.forEach(m=>{
    let nm=m.name||"P";
    if(usedNames.has(nm)){const fi=((m.card&&m.card.name||"").trim()[0]||"");nm=fi?fi+". "+nm:nm;}
    let base=nm,k=2; while(usedNames.has(nm)){nm=base+" "+k;k++;}
    usedNames.add(nm); m.name=nm;
  });

  // map attack-space → screen (y flips for the bottom-goal direction)
  const up=cfg.up;
  const mp=p=>({x:+_clamp(p.ax,2,98).toFixed(1), y:+(up?p.ay:100-p.ay).toFixed(1)});
  out.markers.forEach(m=>{const s=mp(m);m.x=s.x;m.y=s.y;});
  out.ball=mp(out.ball);
  out.steps.forEach(s=>{ if(s.ball)s.ball=mp(s.ball); if(s.moves)s.moves=s.moves.map(mv=>({id:mv.id,...mp(mv)})); });
  return out;
}
function _markHTML(m){
  const cls="cut-mark"+(m.opp?" opp":"")+(m.scorer?" scorer":"")+(m.idle?(Math.random()<0.5?" idle b":" idle"):"")+(m.drift?" mv":"")+(m.gk?" gk":"");
  const ring=(m.card&&m.card.theme&&m.card.theme.border)||(m.opp?"#f87171":"#00f593");
  const inner=m.card?avSVG(m.card,28):'<div class="mk-k">🧤</div>';
  const dly=m.idle?` style="animation-duration:${(2.1+Math.random()*1.3).toFixed(2)}s;animation-delay:${(Math.random()*-2.6).toFixed(2)}s"`:"";
  const nm=m.name?`<div class="mk-name">${m.name}</div>`:"";
  return `<div class="${cls}" id="${m.id}" style="left:${m.x}%;top:${m.y}%;--ring:${ring};"><div class="mk-av"${dly}>${inner}</div>${nm}</div>`;
}
function _burstTitle(el,play){
  const cols=["#00f593","#f59e0b","#60a5fa","#fff","#f87171"];
  const confetti=play.confetti?Array.from({length:16}).map(()=>`<div class="cut-confetti" style="left:${(6+Math.random()*88).toFixed(0)}%;background:${_pick(cols)};animation-delay:${(Math.random()*0.35).toFixed(2)}s;"></div>`).join(""):"";
  const b=document.createElement("div");
  b.className="cut-stage"+(play.shake?" cut-shake":"");
  b.style.cssText="position:absolute;inset:0;z-index:6;";
  b.innerHTML=`${confetti}<div class="cut-title" style="color:${play.color};"><span class="big">${play.title}</span>${play.min?`<span class="sub">${play.min}'</span>`:""}</div>`;
  el.appendChild(b);
  const scan=document.createElement("div"); scan.className="cut-scan"; el.appendChild(scan);
}
async function playScene(kind,ev){
  const el=document.getElementById("cutscene"); if(!el) return;
  const gen=_liveGen, alive=()=>state.screen==="livematch"&&gen===_liveGen;
  const play=buildPlay(kind,ev); if(!play) return;
  el.innerHTML=`<div class="cut-bg"></div>
    <div class="cut-pitch">
      <div class="pl-line"></div><div class="pl-circle"></div>
      <div class="pl-box"></div><div class="pl-arc"></div><div class="pl-goal"></div>
      <div class="pl-box b"></div><div class="pl-arc b"></div><div class="pl-goal b"></div>
      ${play.markers.map(_markHTML).join("")}
      <div class="cut-ball2" id="cutBall" style="left:${play.ball.x}%;top:${play.ball.y}%;"></div>
    </div>
    <div class="cut-skip">tap to skip</div>`;
  el.classList.add("show");
  let done=false;
  const finish=()=>{ if(done)return; done=true; el.classList.remove("show"); el.onclick=null; el.innerHTML=""; };
  el.onclick=finish;
  const ball=el.querySelector("#cutBall");
  const set=(sel,x,y,dur)=>{const n=el.querySelector(sel);if(n){if(dur!=null)n.style.transitionDuration=dur+"ms";n.style.left=x+"%";n.style.top=y+"%";}};
  for(const s of play.steps){
    const total=s.dur*CUT_SPEED;
    if(s.shot&&ball)ball.classList.add("shot");
    if(s.ball)set("#cutBall",s.ball.x,s.ball.y,s.shot?Math.round(total*0.62):total);
    (s.moves||[]).forEach(mv=>set("#"+mv.id,mv.x,mv.y,total));
    await _delay(total);
    if(done||!alive()){finish();return;}
  }
  _burstTitle(el,play);
  await _delay(1600);
  finish();
}
function hideCutscene(){const el=document.getElementById("cutscene");if(el&&el.classList.contains("show")){el.classList.remove("show");el.onclick=null;el.innerHTML="";}}
const _delay=ms=>new Promise(r=>setTimeout(r,ms));

let _liveGen=0;
async function driveLiveMatch(){
  const gen=++_liveGen;
  const active=()=>!!state.liveMatchState&&state.screen==="livematch"&&gen===_liveGen;
  while(active()){
    const lm=state.liveMatchState;
    // Match over → wrap up
    if(lm.shown>=lm.events.length){
      sndCrowd(0.07);
      await _delay(900); if(!active())return;
      const fd=lm.finalData;
      if(fd.result==="win") notify(t("notif_win",{pts:fd.ptGain}),"var(--accent)");
      else if(fd.result==="draw") notify(t("notif_draw",{pts:fd.ptGain}),"var(--legend)");
      else notify(t("notif_loss",{pts:fd.ptGain}),"#f87171");
      await _delay(1700); if(!active())return;
      state.screen="matchreport"; render();
      return;
    }
    const ev=lm.events[lm.shown];
    // Play the cutscene FIRST; the action only lands on the board (sound + score + feed line) afterwards.
    const willCut=(ev.type==="goal_my"||ev.type==="goal_opp")||((ev.type==="def"||ev.type==="miss")&&Math.random()<0.6);
    if(willCut) await playScene(ev.type,ev);
    if(!active()){hideCutscene();return;}
    if(ev.type==="goal_my"){lm.score[0]++;sndGoal();}
    else if(ev.type==="goal_opp"){lm.score[1]++;sndGoal();}
    else{sndCrowd(0.03);}
    lm.shown++;
    render(true);
    await _delay(willCut?1200:1300*MATCH_SPEED);
  }
}

// ══════════════════════════════════════════════════════════
// ACCOUNTS — username + PIN, auto-login on known devices
// ══════════════════════════════════════════════════════════
const ACC_INPUT="width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:var(--text2);font-size:14px;font-family:var(--font-body);box-sizing:border-box;outline:none;";

const feedbackCard=()=>`
    <div class="glass-card" style="margin-top:24px;">
      <div class="sec-label" style="margin:0 0 8px;">${t('feedback_header')}</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px;">${t('feedback_desc')}</div>
      <textarea id="fb-msg" maxlength="2000" rows="4" placeholder="${t('feedback_ph')}" style="${ACC_INPUT}resize:vertical;min-height:84px;line-height:1.4;"></textarea>
      <button class="btn-ghost full accent" onclick="submitFeedback()" style="width:100%;margin-top:10px;">${t('feedback_send')}</button>
    </div>`;

async function submitFeedback(){
  const el=document.getElementById("fb-msg");
  const msg=(el&&el.value||"").trim();
  if(msg.length<3){notify(t('notif_feedback_empty'),"#f87171");return;}
  try{
    const res=await fetch("/.netlify/functions/feedback",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:msg,username:state.account?.username||null,lang:_lang,screen:state.screen})
    });
    if(!res.ok)throw new Error("send failed");
    if(el)el.value="";
    notify(t('notif_feedback_sent'),"var(--accent)");
  }catch(e){
    notify(t('notif_feedback_failed'),"#f87171");
  }
}
let _acctPushTimer=null;
// Block cloud saves until auto-login has resolved, so a wiped local save can't
// clobber good cloud data before we've had a chance to download it.
let _acctBootPending=!!(state.account&&state.account.token);

async function accountApi(action,payload){
  const res=await fetch("/.netlify/functions/account",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action,...payload})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||("Error "+res.status));
  return data;
}
function persistAccount(){
  if(state.account) localStorage.setItem("fc_account",JSON.stringify(state.account));
  else localStorage.removeItem("fc_account");
}
function scheduleAccountPush(){
  clearTimeout(_acctPushTimer);
  _acctPushTimer=setTimeout(pushAccountSave,1500);
}
async function pushAccountSave(){
  if(!state.account||!state.account.token)return;
  if(_acctBootPending)return; // wait for auto-login to download cloud save first
  try{
    await accountApi("save",{token:state.account.token,data:buildSave()});
  }catch(e){
    console.warn("account save failed:",e);
    if(/expired/i.test(e.message)){ state.account=null; persistAccount(); render(); }
  }
}
async function accountRegister(username,pin){
  // Carry the player's current local progress up into the new account.
  const data=await accountApi("register",{username,pin,data:buildSave()});
  _acctBootPending=false;
  state.account={token:data.token,username:data.username};
  persistAccount();
  notify(t('notif_acc_created'),"var(--accent)");
  navTo("home");
}
async function accountLogin(username,pin){
  const data=await accountApi("login",{username,pin});
  _acctBootPending=false;
  state.account={token:data.token,username:data.username};
  persistAccount();
  if(data.data&&Object.keys(data.data).length) applySave(data.data);
  saveState();
  notify(t('notif_welcome_back',{name:data.username}),"var(--accent)");
  navTo("home");
}
async function accountLogout(){
  const tk=state.account&&state.account.token;
  state.account=null; persistAccount();
  if(tk){try{await accountApi("logout",{token:tk});}catch(e){}}
  notify(t('notif_logged_out'),"var(--text3)");
  navTo("account");
}
async function accountDelete(pin){
  if(!state.account)return;
  await accountApi("delete",{token:state.account.token,pin});
  state.account=null; persistAccount();
  notify(t('notif_acc_deleted'),"var(--text3)");
  navTo("account");
}
async function autoLoginBoot(){
  const saved=state.account;
  if(!saved||!saved.token)return;
  try{
    const data=await accountApi("auto",{token:saved.token});
    state.account={token:data.token,username:data.username};
    persistAccount();
    // On a known device the cloud save is the source of truth — this is the
    // recovery path for a browser that wiped its local storage.
    if(data.data&&Object.keys(data.data).length) applySave(data.data);
    _acctBootPending=false; // cloud save downloaded — pushes may now proceed
    render();
  }catch(e){
    if(/expired/i.test(e.message)){ state.account=null; persistAccount(); _acctBootPending=false; render(); }
    else console.warn("auto-login failed (keeping cloud save safe, won't sync this session):",e);
  }
}
function submitRegister(){
  const u=document.getElementById("acc-reg-user").value.trim();
  const p=document.getElementById("acc-reg-pin").value.trim();
  accountRegister(u,p).catch(e=>notify(e.message,"#f87171"));
}
function submitLogin(){
  const u=document.getElementById("acc-login-user").value.trim();
  const p=document.getElementById("acc-login-pin").value.trim();
  accountLogin(u,p).catch(e=>notify(e.message,"#f87171"));
}
function confirmLogout(){ accountLogout().catch(e=>notify(e.message,"#f87171")); }
function confirmDelete(){
  const p=document.getElementById("acc-del-pin").value.trim();
  if(!p){notify(t('acc_enter_pin'),"#f87171");return;}
  if(!confirm(t('acc_delete_confirm')))return;
  accountDelete(p).catch(e=>notify(e.message,"#f87171"));
}
function renderAccount(){
  if(state.account){
    return `<div class="screen fade-up" style="padding:16px;">
      <div class="glass-card" style="text-align:center;">
        <div style="font-size:40px;">👤</div>
        <div style="font-size:20px;font-weight:700;margin-top:6px;">${state.account.username}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:6px;">${t('acc_signed_in')}</div>
      </div>
      <div style="margin-top:14px;">
        <button class="btn-ghost full" onclick="confirmLogout()" style="width:100%;">${t('acc_logout_btn')}</button>
      </div>
      <div class="glass-card" style="margin-top:24px;border-color:rgba(248,113,113,.2);">
        <div class="sec-label" style="margin:0 0 8px;">${t('acc_delete_header')}</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:10px;">${t('acc_delete_desc')}</div>
        <input id="acc-del-pin" type="text" inputmode="numeric" autocomplete="off" name="fc-pin-del" maxlength="8" placeholder="${t('acc_confirm_pin_ph')}" style="${ACC_INPUT}-webkit-text-security:disc;"/>
        <button onclick="confirmDelete()" style="width:100%;margin-top:10px;padding:11px;border-radius:10px;border:1px solid rgba(248,113,113,.4);background:rgba(248,113,113,.1);color:#f87171;font-weight:600;cursor:pointer;font-family:var(--font-body);">${t('acc_delete_btn')}</button>
      </div>
      ${feedbackCard()}
    </div>`;
  }
  const hasProgress=state.collection.length||state.points!==500||state.matchHistory.length;
  return `<div class="screen fade-up" style="padding:16px;">
    <div class="glass-card" style="text-align:center;">
      <div style="font-size:36px;">⚽</div>
      <div style="font-size:18px;font-weight:700;margin-top:4px;">${t('acc_save_title')}</div>
      <div style="font-size:12px;color:var(--text3);margin-top:6px;line-height:1.5;">${t('acc_save_desc')}</div>
    </div>

    <div class="glass-card" style="margin-top:16px;">
      <div class="sec-label" style="margin:0 0 10px;">${t('acc_create_header')}</div>
      ${hasProgress?`<div style="font-size:11px;color:var(--accent);margin-bottom:8px;">${t('acc_progress_saved')}</div>`:""}
      <input id="acc-reg-user" maxlength="20" placeholder="${t('acc_username_ph')}" style="${ACC_INPUT}"/>
      <input id="acc-reg-pin" type="text" inputmode="numeric" autocomplete="off" name="fc-pin-reg" maxlength="8" placeholder="${t('acc_pin_ph')}" style="${ACC_INPUT}margin-top:8px;-webkit-text-security:disc;"/>
      <button class="btn-primary" onclick="submitRegister()" style="width:100%;margin-top:12px;">${t('acc_create_header')}</button>
    </div>

    <div class="glass-card" style="margin-top:16px;">
      <div class="sec-label" style="margin:0 0 10px;">${t('acc_login_header')}</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:8px;">${t('acc_login_desc')}</div>
      <input id="acc-login-user" maxlength="20" placeholder="${t('acc_username_ph')}" style="${ACC_INPUT}"/>
      <input id="acc-login-pin" type="text" inputmode="numeric" autocomplete="off" name="fc-pin-login" maxlength="8" placeholder="PIN" style="${ACC_INPUT}margin-top:8px;-webkit-text-security:disc;"/>
      <button class="btn-ghost full" onclick="submitLogin()" style="width:100%;margin-top:12px;">${t('acc_login_header')}</button>
    </div>

    <div style="text-align:center;margin-top:16px;">
      <button onclick="navTo('home')" style="background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:var(--font-body);text-decoration:underline;">${t('acc_guest')}</button>
    </div>

    ${feedbackCard()}
  </div>`;
}
